<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}</style>
</head>
<body>
<title>像素疊城</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: one-screen game. HUD strip on top, pixel city map in the middle (quest card top-left, panels top-right), tool tray at the bottom; stacking opens as an overlay. Single dark "night console" theme by choice. */
:root{
  --bg:#151726; --panel:#222538; --panel2:#2d3150; --edge:#0b0c16;
  --ink:#efe6cf; --dim:#9d9bb0; --gold:#f4b941; --good:#86d17a; --bad:#ee6a5f; --sky:#7fc4e6;
  --pix:"DotGothic16","Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--pix);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column}
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding-block:8px;padding-inline:16px;background:var(--panel);box-shadow:0 3px 0 var(--edge);z-index:2}
.stat{display:flex;gap:6px;align-items:baseline;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat .k{color:var(--dim);font-size:13px;letter-spacing:.05em}
.stat b{font-weight:400;color:var(--ink)}
#coins{color:var(--gold)}
#inc{color:var(--good);font-size:13px}
#evt{color:var(--gold);font-size:13px}
#lvl{color:var(--sky)}
.spacer{flex:1}
#saved{font-size:12px;color:var(--dim)}
#view{position:relative;flex:1;min-height:0}
#map{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none;cursor:crosshair}
#tools{display:flex;gap:8px;padding-block:10px;padding-inline:16px;overflow-x:auto;background:var(--panel);box-shadow:0 -3px 0 var(--edge);z-index:2}
button{font:inherit;color:var(--ink);background:var(--panel2);border:0;padding:8px 12px;cursor:pointer;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.4),inset 3px 3px 0 rgba(255,255,255,.1),0 0 0 2px var(--edge)}
button:hover{filter:brightness(1.15)}
button:active{box-shadow:inset 3px 3px 0 rgba(0,0,0,.4),0 0 0 2px var(--edge)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed;filter:none}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;flex:0 0 auto}
.tool small{font-size:11px;color:var(--dim)}
.tool.on{background:var(--gold);color:#2a1d05}
.tool.on small{color:#5a3f0a}
.tool.locked{opacity:.55}
.zoom{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px}
.zoom button{width:40px;height:40px;padding:0;font-size:20px}
#quest{position:absolute;left:16px;top:16px;max-width:min(330px,calc(100% - 32px));display:flex;flex-direction:column;gap:8px;z-index:2}
.qc{background:rgba(11,12,22,.88);padding:8px 12px;box-shadow:0 0 0 2px var(--panel2);display:flex;flex-direction:column;gap:2px;line-height:1.4}
.qc .k{color:var(--dim);font-size:12px;letter-spacing:.05em}
.qc .rw{color:var(--gold);font-size:13px}
.qc.done{box-shadow:0 0 0 2px var(--gold)}
.qc.req{box-shadow:0 0 0 2px var(--sky)}
.qc button{align-self:flex-start;margin-top:4px;padding:4px 10px;font-size:13px}
.panel{position:absolute;right:16px;top:16px;width:min(330px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:var(--panel);padding:14px 16px;
  box-shadow:0 0 0 3px var(--edge),6px 6px 0 rgba(0,0,0,.45);display:flex;flex-direction:column;gap:8px;z-index:3}
.panel h3{margin:0;font-weight:400;font-size:18px;color:var(--gold)}
.panel p{margin:0;line-height:1.55}
.panel .row{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.ok{color:var(--good)} .no{color:var(--bad)} .dimtxt{color:var(--dim);font-size:13px}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.pick small{color:var(--dim);font-size:12px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.ach{display:flex;gap:10px;align-items:flex-start;padding-block:4px}
.ach i{flex:0 0 14px;height:14px;margin-top:3px;background:var(--panel2);box-shadow:0 0 0 2px var(--edge)}
.ach.got i{background:var(--gold)}
.ach div{display:flex;flex-direction:column;min-width:0}
.ach small{color:var(--dim);font-size:12px}
.ach:not(.got) b{color:var(--dim)}
.ach b{font-weight:400}
.log{display:flex;flex-direction:column;gap:6px}
.log p{font-size:13px}
.log span{color:var(--dim)}
#toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);max-width:calc(100% - 96px);background:var(--edge);color:var(--ink);padding:8px 14px;
  box-shadow:0 0 0 2px var(--gold);pointer-events:none;opacity:0;transition:opacity .25s;text-align:center;line-height:1.4;z-index:4}
#toast.show{opacity:1}
#toast.alert{box-shadow:0 0 0 2px var(--bad)}
#banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);background:var(--edge);padding:16px 28px;box-shadow:0 0 0 3px var(--gold),8px 8px 0 rgba(0,0,0,.5);
  text-align:center;z-index:5;pointer-events:none;display:flex;flex-direction:column;gap:4px;max-width:calc(100% - 32px)}
#banner b{font-weight:400;font-size:26px;color:var(--gold)}
#banner span{color:var(--ink);line-height:1.5}
#stack{position:fixed;inset:0;background:rgba(8,9,18,.8);display:flex;align-items:center;justify-content:center;padding-inline:16px;z-index:10}
.sbox{background:var(--panel);padding:14px;box-shadow:0 0 0 3px var(--edge),8px 8px 0 rgba(0,0,0,.5);display:flex;flex-direction:column;gap:10px;align-items:center;max-width:100%}
#shead{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-variant-numeric:tabular-nums}
#shead .k{color:var(--dim);font-size:13px}
.swrap{position:relative}
#sc{display:block;height:min(62vh,480px);aspect-ratio:2/3;max-width:calc(100vw - 60px);image-rendering:pixelated;touch-action:none;cursor:pointer;box-shadow:0 0 0 2px var(--edge)}
#sflash{position:absolute;left:0;right:0;top:18%;text-align:center;font-size:22px;color:var(--gold);text-shadow:2px 2px 0 var(--edge);opacity:0;transition:opacity .5s,transform .5s;pointer-events:none}
#sflash.show{opacity:1;transform:translateY(-8px);transition:none}
#sres{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(11,12,22,.84);text-align:center;padding:16px;overflow:auto}
#sres h3{margin:0;font-weight:400;color:var(--gold);font-size:22px}
#sres p{margin:0;line-height:1.6}
#sres .btnrow{justify-content:center}
#sres .share{font-size:13px;color:var(--dim);user-select:all;background:var(--edge);padding:6px 8px;max-width:100%;overflow-wrap:anywhere}
.shint{margin:0;color:var(--dim);font-size:13px;text-align:center;max-width:320px}
@media (prefers-reduced-motion:reduce){#toast,#sflash{transition:none}}
</style>

<div id="app">
  <header id="hud">
    <div class="stat"><span class="k">金幣</span><b id="coins">0</b><span id="inc"></span></div>
    <div class="stat"><span class="k">人口</span><b id="pop">0</b></div>
    <div class="stat"><span class="k">幸福</span><b id="hap">—</b></div>
    <div class="stat"><span class="k">交通</span><b id="trf">順暢</b></div>
    <div class="stat"><b id="lvl">村莊</b></div>
    <div class="stat"><b id="clock">春 · 第 1 天 07:00</b></div>
    <div class="stat"><span class="k">天氣</span><b id="wx">晴天</b><span id="evt"></span></div>
    <div class="spacer"></div>
    <span id="saved">尚未存檔</span>
    <button id="chBtn" type="button">每日挑戰</button>
    <button id="musicBtn" type="button" aria-label="音樂開關">音樂 開</button>
    <button id="menuBtn" type="button">選單</button>
  </header>
  <main id="view">
    <canvas id="map" aria-label="城市地圖"></canvas>
    <div id="quest" aria-live="polite"></div>
    <div class="zoom"><button id="zin" type="button" aria-label="放大">+</button><button id="zout" type="button" aria-label="縮小">−</button></div>
    <div id="info" class="panel" hidden></div>
    <div id="banner" hidden></div>
    <div id="toast" role="status"></div>
  </main>
  <nav id="tools">
    <button class="tool on" data-tool="look" type="button">查看<small>點選格子</small></button>
    <button class="tool" data-tool="build" type="button">蓋樓<small>疊疊樂</small></button>
    <button class="tool" data-tool="road" type="button">道路<small>5 金/格</small></button>
    <button class="tool" data-tool="park" type="button">公園<small>30 金</small></button>
    <button class="tool" data-tool="shop" type="button">商店<small>60 金</small></button>
    <button class="tool" data-tool="school" type="button">學校<small>120 金</small></button>
    <button class="tool" data-tool="factory" type="button">工廠<small>150 金</small></button>
    <button class="tool" data-tool="big" type="button">大型<small>2×2</small></button>
    <button class="tool" data-tool="landmark" type="button">地標<small>獨一無二</small></button>
    <button class="tool" data-tool="land" type="button">買地<small>擴張</small></button>
    <button class="tool" data-tool="bulldoze" type="button">拆除<small>免費</small></button>
  </nav>
</div>

<div id="stack" hidden>
  <div class="sbox">
    <div id="shead"></div>
    <div class="swrap">
      <canvas id="sc" width="160" height="240" aria-label="疊樓畫面"></canvas>
      <div id="sflash"></div>
      <div id="sres" hidden></div>
    </div>
    <div class="btnrow"><button id="sfinish" type="button">完工</button></div>
    <p class="shint" id="shint">點畫面或按空白鍵放下樓層。對齊下面那層就是「完美」。</p>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const W = 44, H = 28, T = 16, M = 96, WW = W*T, WH = M + H*T;
const PS = 4, PC = W/PS, PR = H/PS;
const TIERS = [
  { name:'木屋', cost:20,  max:5,  pop:2, fh:3, bh:14, speed:46, unlock:0,   wall:'#e3b98c', wallD:'#b0825a', roof:'#c4503a', roofL:'#e3735c', win:'#5d7fa8' },
  { name:'公寓', cost:80,  max:15, pop:4, fh:3, bh:11, speed:58, unlock:50,  wall:'#c98f6a', wallD:'#935e43', roof:'#5b5e70', roofL:'#80849a', win:'#4f6d93' },
  { name:'大樓', cost:300, max:40, pop:6, fh:2, bh:8,  speed:70, unlock:250, wall:'#86b6d6', wallD:'#4f7ea6', roof:'#3a3f55', roofL:'#5c6380', win:'#2f5375' },
];
const GOLD = { wall:'#f2c94c', wallD:'#b8892a', win:'#fff3b0' };
const WEATHER = [ {n:'晴天', w:0}, {n:'多雲', w:.12}, {n:'下雨', w:.2, rain:1}, {n:'強風', w:.5}, {n:'颱風', w:.8, rain:1}, {n:'下雪', w:.1, snow:1} ];
const SEASONS = [
  { n:'春', grass:['#62a352','#66a856'], dots:['#f6b8c8','#ffffff','#4e8a40'], tree:['#2f7a3a','#4fa055','#2a6833'], blossom:'#f4a7c0', water:'#4f93c9', waterL:'#8cc6ef', hill:'#79b764', hillD:'#5c9a4c', shore:'#d8c79a', forest:['#2b5a35','#23492c','#356d40','#1f3f27'], fdot:'#f4a7c0' },
  { n:'夏', grass:['#5b9b4b','#5f9f4f'], dots:['#e8d36b','#f2a3b5','#4e8a40'], tree:['#2f7a3a','#4fa055','#2a6833'], water:'#3f8fd0', waterL:'#9ad2f5', hill:'#6fae5a', hillD:'#548f45', shore:'#e0cf9c', forest:['#245230','#1d4228','#2f6a3c','#1a3a22'], fdot:'#41804c' },
  { n:'秋', grass:['#8e9a4c','#949f50'], dots:['#d9822b','#c45a2a','#e8b84a'], tree:['#c4642a','#e39a3b','#9a4a22'], water:'#4a84b0', waterL:'#86b8d8', hill:'#a39a55', hillD:'#857c40', shore:'#d0bf8a', forest:['#5a4a25','#6b3d1f','#8a5a28','#3d2f18'], fdot:'#d9822b' },
  { n:'冬', grass:['#e8eef2','#e1e9ee'], dots:['#c9d6df','#ffffff','#b8c8d4'], tree:['#4f6f5f','#eef4f7','#41604f'], water:'#b9dcef', waterL:'#eef8fd', hill:'#f4f8fa', hillD:'#c8d5de', shore:'#dfe7ec', forest:['#b9c8d3','#9fb3c1','#e3eaef','#8399a8'], fdot:'#ffffff', snow:1 },
];
const COST = { road:5, park:30, shop:60, school:120, factory:150 };
const BRIDGE = 25;
const UNLOCK = { school:20, factory:40 };
const NAMES = { road:'道路', park:'公園', shop:'商店', school:'學校', factory:'工廠', hospital:'醫院', mall:'購物中心', stadium:'體育場' };
const LANDMARKS = [
  { name:'鐘塔',     cost:500,  unlock:100, tour:4,  desc:'全城幸福 +5，每小時觀光收入 +4' },
  { name:'摩天輪',   cost:1200, unlock:200, tour:10, desc:'全城幸福 +5，每小時觀光收入 +10' },
  { name:'像素巨塔', cost:3000, unlock:400, tour:25, desc:'全城幸福 +5，每小時觀光收入 +25' },
];
const BIGS = [
  { k:'hospital', name:'醫院',     cost:800,  lv:1, desc:'7 格內的住戶幸福 +15' },
  { k:'mall',     name:'購物中心', cost:1000, lv:1, desc:'6 格內都算「附近有商店」，顧客越多越賺' },
  { k:'stadium',  name:'體育場',   cost:1500, lv:2, desc:'全城幸福 +5、每小時觀光收入 +8，煙火節加倍' },
];
const ROOFS = { garden:{ n:'屋頂花園', d:'這棟幸福 +5' }, heli:{ n:'停機坪', d:'每小時 +2 金' }, neon:{ n:'霓虹招牌', d:'每小時 +1 金，晚上會發光' } };
const LEVELS = [ { n:'村莊', pop:0 }, { n:'小鎮', pop:100, u:'解鎖買地、醫院、購物中心' }, { n:'城市', pop:400, u:'解鎖體育場' }, { n:'大都會', pop:1000, u:'金色樓層出現機率加倍' } ];
const POLICIES = { green:{ n:'綠色城市', d:'公園的幸福加成從 +15 變 +25' }, econ:{ n:'經濟優先', d:'商店、購物中心、工廠收入 +25%' }, tour:{ n:'觀光立市', d:'地標、體育場觀光收入 +50%' } };
const CHALLENGES = [
  { n:'颱風大樓', w:4, tier:2, sp:1 },
  { n:'雪地木屋', w:5, tier:0, sp:1.25 },
  { n:'強風公寓', w:3, tier:1, sp:1 },
  { n:'雨中大樓', w:2, tier:2, sp:1.1 },
  { n:'晴天極速', w:0, tier:0, sp:1.7 },
  { n:'狂風極速', w:3, tier:2, sp:1.3 },
  { n:'雪地公寓', w:5, tier:1, sp:1.1 },
];
const N4 = [[1,0],[-1,0],[0,1],[0,-1]];
const LS = 'pixel-stack-city-v1', PREFS = 'pixel-stack-city-prefs';
const idx = (x,y) => y*W + x, inb = (x,y) => x>=0 && y>=0 && x<W && y<H;
const pidx = (px,py) => py*PC + px;
const get = (x,y) => inb(x,y) ? S.grid[idx(x,y)] : null;
const terr = (x,y) => inb(x,y) ? S.terr[idx(x,y)] : 0;
const owned = (x,y) => inb(x,y) && !!S.own[pidx((x/PS)|0, (y/PS)|0)];
const pad = n => String(n).padStart(2,'0');
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const dayNo = () => Math.floor(S.min/1440) + 1;
const season = () => Math.floor((dayNo()-1)/7) % 4;
const hourNow = () => (S.min % 1440)/60;
function hash(x,y){ let h = Math.imul(x|0,374761393) + Math.imul(y|0,668265263); h = Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967296; }
function rng(seed){ return () => { seed = (Math.imul(seed,1664525)+1013904223)>>>0; return seed/4294967296; }; }

let S, ST = { pop:0, happy:0, inc:0, res:{}, cnt:{}, maxF:[0,0,0], lmBuilt:[], cong:0, bridges:0, roofs:0 };
const C = k => ST.cnt[k] || 0;

/* ---------- new game, terrain, migration ---------- */
function genTerrain(s, r, ownedTrees){
  const G = s.grid, TR = s.terr, free = i => !G[i];
  let rx = 28 + Math.floor(r()*4);
  for (let y=0; y<H; y++){
    if (y > 0) rx += [-1,0,0,1][Math.floor(r()*4)];
    rx = clamp(rx, 25, 33);
    for (const xx of [rx, rx+1]){ const i = idx(xx,y); if (free(i) || G[i].k === 'road') TR[i] = 1; }
  }
  for (let y=17; y<27; y++) for (let x=8; x<20; x++){ const dx = (x-13.5)/4.4, dy = (y-21.5)/2.9; if (dx*dx + dy*dy <= 1 && free(idx(x,y))) TR[idx(x,y)] = 1; }
  for (const [cx,cy,rr] of [[15,6,3.3],[39,21,3.5],[3,9,2.8],[38,3,2.5]])
    for (let y=0; y<H; y++) for (let x=0; x<W; x++){ if (Math.hypot(x-cx, (y-cy)*1.2) <= rr && TR[idx(x,y)] === 0) TR[idx(x,y)] = 2; }
  for (let x=0; x<W; x++){ const i = idx(x,13); if (!G[i]) G[i] = { k:'road' }; }
  for (let y=0; y<H; y++) for (let x=0; x<W; x++){
    const i = idx(x,y); if (G[i] || TR[i] === 1 || Math.abs(y-13) < 2) continue;
    const own = s.own[pidx((x/PS)|0,(y/PS)|0)];
    if (own ? (ownedTrees && r() < .07) : r() < .45) G[i] = { k:'tree' };
  }
}
function newGame(){
  const r = rng((Date.now() & 0xffffff) | 1);
  const s = { v:3, coins:150, min:7*60, weather:0, wind:0, windDir:1, unlock:0, level:0,
    grid:new Array(W*H).fill(null), terr:new Array(W*H).fill(0), own:new Array(PC*PR).fill(0), bought:0,
    savedAt:0, quest:0, ach:{}, st:{}, log:[], evt:null, req:null, nextReq:1440, policy:null, daily:null };
  for (let py=1; py<=5; py++) for (let px=2; px<=8; px++) s.own[pidx(px,py)] = 1;
  genTerrain(s, r, true);
  return s;
}
function migrate(o){
  const g2 = new Array(W*H).fill(null);
  o.grid.forEach((t,i) => { if (t) g2[idx(i%28 + 8, ((i/28)|0) + 4)] = t; });
  o.grid = g2; o.terr = new Array(W*H).fill(0); o.own = new Array(PC*PR).fill(0); o.bought = 0;
  for (let py=1; py<=5; py++) for (let px=2; px<=8; px++) o.own[pidx(px,py)] = 1;
  genTerrain(o, rng(20261019), false);
  o.v = 3;
}
function sanitize(o){
  if (!o || typeof o !== 'object' || !Array.isArray(o.grid)) return null;
  if (o.grid.length === 560) migrate(o);
  if (o.grid.length !== W*H || !Array.isArray(o.terr) || !Array.isArray(o.own)) return null;
  const s = Object.assign(newGame(), o);
  s.ach = s.ach || {}; s.st = s.st || {}; s.log = Array.isArray(s.log) ? s.log : [];
  return s;
}
function addLog(msg){ S.log.push({ d:dayNo(), m:msg }); if (S.log.length > 40) S.log.shift(); }

/* ---------- city rules ---------- */
const roadAdj = (x,y) => N4.some(([a,b]) => get(x+a,y+b)?.k === 'road');
function bigRoad(ax,ay){ for (let i=0; i<2; i++){ if (get(ax+i,ay-1)?.k === 'road' || get(ax+i,ay+2)?.k === 'road' || get(ax-1,ay+i)?.k === 'road' || get(ax+2,ay+i)?.k === 'road') return true; } return false; }
function near(x,y,r,k){ for (let dy=-r; dy<=r; dy++) for (let dx=-r; dx<=r; dx++){ if (Math.abs(dx)+Math.abs(dy) > r) continue; const t = get(x+dx,y+dy); if (t && (t.k === k || t.bk === k)) return true; } return false; }
function nearTerr(x,y,r,v){ for (let dy=-r; dy<=r; dy++) for (let dx=-r; dx<=r; dx++){ if (Math.abs(dx)+Math.abs(dy) > r) continue; if (inb(x+dx,y+dy) && S.terr[idx(x+dx,y+dy)] === v) return true; } return false; }
function popNear(x,y,r){ let c = 0; for (const k in ST.res){ const e = ST.res[k]; if (!e.res) continue; const bx = k%W, by = (k/W)|0; if (Math.abs(bx-x)+Math.abs(by-y) <= r) c += e.res; } return c; }
const policy = () => S.policy && S.min < S.policy.until ? S.policy.k : null;
const festival = () => S.evt?.k === 'fireworks' && S.evt.done;
const blackout = () => S.evt?.k === 'blackout' && S.evt.done && !S.evt.end;
const heavyCount = t => ((t.s || '').match(/h/g) || []).length;
function evalB(x,y,t){
  const road = roadAdj(x,y), park = near(x,y,3,'park'), shop = near(x,y,4,'shop') || near(x,y,6,'mall');
  const school = near(x,y,5,'school'), hosp = near(x,y,7,'hospital'), smog = near(x,y,2,'factory');
  const water = nearTerr(x,y,2,1), hill = S.terr[idx(x,y)] === 2;
  const lm = Math.min(15, C('lm')*5), stad = Math.min(10, C('stadium')*5), fest = festival() ? 10 : 0;
  const parkB = park ? (policy() === 'green' ? 25 : 15) : 0, garden = t.roof === 'garden' ? 5 : 0, traffic = Math.round(ST.cong*15);
  const h = clamp(30 + parkB + (shop?15:0) + (school?10:0) + (hosp?15:0) + (water?10:0) + (hill?10:0) + garden + Math.round((t.p||0)*10) + lm + stad + fest - (smog?20:0) - traffic, 0, 100);
  return { road, park, shop, school, hosp, smog, water, hill, lm, stad, fest, garden, traffic, h, res: road ? (t.f + heavyCount(t))*TIERS[t.t].pop : 0 };
}
function compute(){
  const cnt = {}, maxF = [0,0,0], lmBuilt = [];
  let roofs = 0, bridges = 0, junc = 0, roads = 0;
  S.grid.forEach((t,i) => {
    if (!t) return;
    const x = i%W, y = (i/W)|0;
    if (t.k === 'big' && (x !== t.ax || y !== t.ay)) return;
    const k = t.k === 'big' ? t.bk : t.k;
    cnt[k] = (cnt[k] || 0) + 1;
    if (t.k === 'bld'){ maxF[t.t] = Math.max(maxF[t.t], t.f); if (t.roof) roofs++; }
    else if (t.k === 'lm') lmBuilt[t.id] = true;
    else if (t.k === 'road'){
      roads++; if (S.terr[i] === 1) bridges++;
      let n = 0; for (const [a,b] of N4) if (get(x+a,y+b)?.k === 'road') n++;
      if (n >= 3) junc++;
    }
  });
  ST.cnt = cnt; ST.maxF = maxF; ST.lmBuilt = lmBuilt; ST.roofs = roofs; ST.bridges = bridges;
  const res = {}; let pop = 0;
  for (let i=0; i<S.grid.length; i++){ const t = S.grid[i]; if (t?.k !== 'bld') continue; const r0 = roadAdj(i%W,(i/W)|0) ? (t.f + heavyCount(t))*TIERS[t.t].pop : 0; pop += r0; }
  const cap = roads*6 + junc*12;
  ST.cong = pop && cap ? clamp(pop/cap - 1, 0, 1) : 0;
  let hs = 0, resInc = 0, extra = 0;
  for (let i=0; i<S.grid.length; i++){
    const t = S.grid[i]; if (t?.k !== 'bld') continue;
    const e = evalB(i%W, (i/W)|0, t); res[i] = e; hs += e.h*e.res; resInc += e.res*0.2*(e.h/60);
    if (e.road && t.roof === 'heli') extra += 2;
    if (e.road && t.roof === 'neon') extra += 1;
  }
  ST.res = res;
  const happy = pop ? Math.round(hs/pop) : 0, pol = policy();
  const econ = pol === 'econ' ? 1.25 : 1, tourM = pol === 'tour' ? 1.5 : 1, market = S.evt?.k === 'market' ? 2 : 1;
  let biz = 0, tour = 0;
  S.grid.forEach((t,i) => {
    if (!t) return;
    const x = i%W, y = (i/W)|0;
    if (t.k === 'shop'){ const road = roadAdj(x,y), c = road ? popNear(x,y,4) : 0, v = Math.min(c,60)*0.08*econ*market; res[i] = { customers:c, inc:v, road }; biz += v; }
    else if (t.k === 'factory'){ const road = roadAdj(x,y), c = road ? popNear(x,y,6) : 0, v = Math.min(c,80)*0.15*econ; res[i] = { workers:c, inc:v, road }; biz += v; }
    else if (t.k === 'lm'){ const v = LANDMARKS[t.id].tour*(0.5 + happy/100)*tourM; res[i] = { inc:v }; tour += v; }
    else if (t.k === 'big' && x === t.ax && y === t.ay){
      const road = bigRoad(x,y);
      if (t.bk === 'mall'){ const c = road ? popNear(x,y,6) : 0, v = Math.min(c,150)*0.1*econ*market; res[i] = { customers:c, inc:v, road }; biz += v; }
      else if (t.bk === 'stadium'){ const v = road ? 8*(0.5 + happy/100)*tourM*(festival() ? 2 : 1) : 0; res[i] = { inc:v, road }; tour += v; }
      else res[i] = { road };
    }
  });
  if (S.evt?.k === 'typhoon') resInc *= .5;
  if (blackout()) resInc *= .8;
  ST.pop = pop; ST.happy = happy; ST.inc = resInc + biz + tour + extra;
  let u = S.unlock; TIERS.forEach((t,i) => { if (pop >= t.unlock && i > u) u = i; });
  if (u > S.unlock){ S.unlock = u; toast(`解鎖新建築：${TIERS[u].name}！`); beep(880,.25,'triangle'); markDirty(); }
  let L = S.level || 0; LEVELS.forEach((l,i) => { if (pop >= l.pop && i > L) L = i; });
  if (L > (S.level || 0)){ S.level = L; levelUp(L); }
}
function changed(){ roadsCache = null; compute(); markDirty(); scheduleSave(); }
function cutFloors(t, n){
  t.f -= n; t.w.length = t.f; t.o.length = t.f; t.s = (t.s || '').slice(0, t.f);
  t.p = Math.round(t.w.reduce((a,b) => a+b, 0)/t.f*100)/100;

/* ---------- time, weather, events ---------- */
function dark(){
  const h = hourNow();
  if (h < 5 || h >= 20.5) return .62;
  if (h < 7) return .62 * (1 - (h-5)/2);
  if (h >= 18) return .62 * ((h-18)/2.5);
  return 0;
}
const SEASON_MSG = ['春天來了，櫻花開了！', '夏天到了，煙火節變多了。', '秋天了，樹葉轉紅。', '冬天來了，下雪天疊樓會滑，河面也結冰了。'];
function newDay(){
  const d = dayNo(), sea = season(), r = Math.random();
  let w = r < .38 ? 0 : r < .6 ? 1 : r < .8 ? 2 : 3;
  if (sea === 3 && (w === 2 || Math.random() < .2)) w = 5;
  if (sea !== 3 && d >= 4 && Math.random() < .07) w = 4;
  S.weather = w; S.wind = WEATHER[w].w; S.windDir = Math.random() < .5 ? -1 : 1;
  const r2 = Math.random(), hr = a => a + Math.floor(Math.random()*8);
  let evt = null;
  if (w === 4) evt = { k:'typhoon', h:12 };
  else if (d % 10 === 0) evt = { k:'election', h:9 };
  else if (d >= 5 && r2 < .07) evt = { k:'quake', h:hr(7) };
  else if (d >= 8 && r2 < .1) evt = { k:'ufo', h:21 };
  else if (ST.pop >= 20 && r2 < .16) evt = { k:'blackout', h:19 };
  else if (r2 < (sea === 1 ? .32 : .22)) evt = { k:'fireworks', h:20 };
  else if (r2 < .3 + (C('lm') ? .1 : 0)) evt = { k:'tour', h:hr(9) };
  else if (r2 < .5 && (C('shop') || C('mall'))) evt = { k:'market', h:8 };
  S.evt = evt;
  if ((d - 1) % 7 === 0){ toast(SEASON_MSG[sea]); addLog(SEASON_MSG[sea]); }
  else if (w === 4){ toast('颱風警報！中午颱風登陸，疊得歪的高樓可能被吹壞。今天居民收入減半。', true); addLog('颱風警報發布'); }
  else {
    const tip = w === 3 ? '（疊樓時會被吹偏）' : w === 2 ? '（地面濕滑，完美判定變嚴格）' : w === 5 ? '（放下樓層後會往前滑）' : '';
    toast(`${SEASONS[sea].n} · 第 ${d} 天 · ${WEATHER[w].n}${tip}`);
  }
  compute(); markDirty();
}
let mapShake = 0, ufo = null;
function fireEvent(){
  const e = S.evt; e.done = true;
  if (e.k === 'quake'){
    mapShake = 2.2; beep(70,.8,'sawtooth',.07);
    let lost = 0, hit = 0, total = 0;
    S.grid.forEach((t,i) => {
      if (t?.k !== 'bld') return; total++;
      if (t.p >= .65 || t.f < 2) return;
      const x = i%W, y = (i/W)|0, half = near(x,y,7,'hospital') ? .5 : 1;
      const n = Math.min(t.f - 1, Math.max(1, Math.round((1 + Math.floor(t.f*(.65 - t.p)*1.5))*half)));
      cutFloors(t, n); lost += n; hit++;
    });
    const msg = lost ? `地震！${hit} 棟歪樓共倒了 ${lost} 層。疊得越整齊越耐震。` : total ? '地震！所有建築都穩穩撐住了。' : '輕微地震，城裡沒有損失。';
    if (!lost && total >= 3) S.st.quakeSafe = 1;
    toast(msg, true); addLog(msg); changed();
  } else if (e.k === 'typhoon'){
    mapShake = .8; beep(90,.6,'sawtooth',.05);
    let lost = 0, hit = 0, trees = 0;
    S.grid.forEach((t,i) => {
      if (t?.k === 'tree' && owned(i%W,(i/W)|0) && Math.random() < .25){ S.grid[i] = null; trees++; return; }
      if (t?.k !== 'bld' || t.f < 6 || t.p >= .7) return;
      const n = Math.min(t.f - 1, 1 + Math.floor(Math.random()*3));
      cutFloors(t, n); lost += n; hit++;
    });
    const msg = `颱風登陸！${hit ? `${hit} 棟高樓被吹掉 ${lost} 層` : '高樓都撐住了'}${trees ? `，吹倒 ${trees} 棵樹` : ''}。`;
    toast(msg, true); addLog(msg); changed();
  } else if (e.k === 'tour'){
    const gain = Math.floor((40 + 120*C('lm') + ST.pop*.3)*(policy() === 'tour' ? 1.5 : 1));
    S.coins += gain; beep(784,.15,'triangle');
    const msg = `觀光團來玩了！帶來 ${gain} 金。${C('lm') ? '' : '蓋地標能吸引更多遊客。'}`;
    toast(msg); addLog(msg); markDirty();
  } else if (e.k === 'market'){
    const msg = '今天是市集日，商店收入加倍！'; toast(msg); addLog(msg);
  } else if (e.k === 'blackout'){
    const msg = '停電了！今晚城市一片漆黑，居民收入減少。'; toast(msg, true); addLog(msg); beep(110,.3,'square',.04); compute();
  } else if (e.k === 'fireworks'){
    S.st.fireworks = 1;
    const msg = `煙火節開始了！今天全城幸福 +10${C('stadium') ? '，體育場收入加倍' : ''}。`; toast(msg); addLog(msg); compute();
  } else if (e.k === 'ufo'){
    const blds = []; S.grid.forEach((t,i) => { if (t?.k === 'bld' && t.f < TIERS[t.t].max) blds.push(i); });
    const i = blds.length ? blds[Math.floor(Math.random()*blds.length)] : -1;
    ufo = { t:0, i, applied:false };
    toast('天空出現奇怪的光……');
  } else if (e.k === 'election'){
    const ap = ST.pop ? ST.happy : 50;
    if (ap >= 55){
      S.st.elected = (S.st.elected || 0) + 1; addLog(`市長選舉勝選（支持率 ${ap}%）`);
      sel = null;
      panel(`<h3>選舉勝選！</h3><p>支持率 ${ap}%，你連任市長了。選一個接下來 10 天的施政方針：</p>` +
        Object.entries(POLICIES).map(([k,p]) => `<button class="pick" type="button" data-act="policy" data-p="${k}"><span>${p.n}</span><small>${p.d}</small></button>`).join(''));
      beep(784,.15,'triangle'); setTimeout(() => beep(1046,.25,'triangle'), 150);
    } else {
      const msg = `市長選舉落選了，支持率只有 ${ap}%。把居民照顧得更幸福，下次再來（第 ${dayNo()+10} 天）。`;
      toast(msg, true); addLog(msg);
    }
  }
}
function updUfo(dt){
  if (!ufo) return;
  ufo.t += dt;
  if (!ufo.applied && ufo.t >= 5){
    ufo.applied = true; S.st.ufo = 1;
    const t = ufo.i >= 0 ? S.grid[ufo.i] : null;
    if (t?.k === 'bld'){
      const n = Math.min(3, TIERS[t.t].max - t.f), top = t.f - 1;
      for (let k=0; k<n; k++){ t.w.push(t.w[top]); t.o.push(t.o[top]); t.s = (t.s || '') + 'n'; t.f++; }
      const msg = `外星人來訪！幫一棟${TIERS[t.t].name}加蓋了 ${n} 層，然後飛走了。`; toast(msg); addLog(msg);
    } else { S.coins += 300; const msg = '外星人來訪！留下一塊奇怪的金屬，賣了 300 金。'; toast(msg); addLog(msg); }
    beep(1400,.3,'sine',.05); changed();
  }
  if (ufo.t > 8) ufo = null;
}
function tick(dt){
  const before = S.min; S.min += dt * 6;
  if (Math.floor(S.min/60) > Math.floor(before/60)) S.coins += ST.inc;
  if (Math.floor(S.min/1440) > Math.floor(before/1440)) newDay();
  if (S.evt && !S.evt.done && hourNow() >= S.evt.h) fireEvent();
  if (S.evt?.k === 'blackout' && S.evt.done && !S.evt.end && hourNow() >= 23){ S.evt.end = 1; toast('電力恢復了。'); compute(); }
  if (S.policy && S.min >= S.policy.until){ addLog(`施政方針「${POLICIES[S.policy.k].n}」結束`); S.policy = null; compute(); }
}

const NEEDS = [
  { k:'park', r:3, n:'公園', ok:() => true },
  { k:'shop', r:4, n:'商店', ok:() => true },
  { k:'school', r:5, n:'學校', ok:() => ST.pop >= UNLOCK.school },

const needMet = (x,y,nd) => near(x,y,nd.r,nd.k) || (nd.k === 'shop' && near(x,y,6,'mall'));
function reqTick(){
  const R = S.req;
  if (R){
    const t = get(R.x,R.y), nd = NEEDS.find(n => n.k === R.need);
    if (t?.k !== 'bld'){ S.req = null; return; }
    if (needMet(R.x,R.y,nd)){
      S.coins += R.reward; S.st.req = (S.st.req || 0) + 1; S.req = null; S.nextReq = S.min + 1440*(.6 + Math.random()*.6);
      const msg = `居民很開心！請求完成，獲得 ${R.reward} 金。`; toast(msg); addLog(msg); beep(880,.15,'triangle'); markDirty();
    } else if (S.min > R.until){
      S.req = null; S.nextReq = S.min + 1440*.5; const msg = '居民等不到，放棄了他們的請求。'; toast(msg); addLog(msg); markDirty();
    }
    return;
  }
  if (S.min < (S.nextReq || 0) || C('bld') < 2) return;
  const cands = [];
  S.grid.forEach((t,i) => {
    if (t?.k !== 'bld') return; const x = i%W, y = (i/W)|0;
    if (!roadAdj(x,y)) return;
    for (const nd of NEEDS) if (nd.ok() && !needMet(x,y,nd)) cands.push({ x, y, nd, t });
  });
  if (!cands.length){ S.nextReq = S.min + 720; return; }
  const c = cands[Math.floor(Math.random()*cands.length)];
  S.req = { x:c.x, y:c.y, need:c.nd.k, until:S.min + 2*1440, reward:50 + c.t.f*10 };
  toast(`有居民提出請求了！看看左上角。`); markDirty();
}

function note(t, m, d, type, vol){

}

function musicTick(){
  if (!prefs.music || !AC || !MUS.started || AC.state !== 'running') return;
  if (MUS.next < AC.currentTime) MUS.next = AC.currentTime + .05;
  const song = (S.weather === 4 || mapShake > 0) ? STORM_SONG : dark() > .3 ? NIGHT_SONG : LEVEL_SONGS[S.level || 0];

      if (pos === 0 || pos === 4) note(t, ch[0] - 24, e8*3.6, 'triangle', .2);

      if (song.storm && pos % 2 === 0) note(t, 40, e8*.4, 'sawtooth', .02);
      const sec = [0,0,1,0][phrase % 4], hv = hash((s % 32) + sec*97, 3 + sec*13);

let walkers = [], cars = [], roadsCache = null;
const SHIRTS = ['#e85d5d','#5d9be8','#f4b941','#b07be0','#5fcf9a','#f08bc0'];
const CAR_COLS = ['#d64545','#3f78c9','#e8b23a','#e8e8e8','#3a3a46','#4fae6a'];
function roads(){ if (!roadsCache){ roadsCache = []; S.grid.forEach((t,i) => { if (t?.k === 'road') roadsCache.push(i); }); } return roadsCache; }
function stepMover(w, speed, dt){
  const dx = w.tx - w.fx, dy = w.ty - w.fy, d = Math.hypot(dx,dy);
  if (d < .02){
    w.fx = w.tx; w.fy = w.ty;
    let opts = N4.map(([a,b]) => [w.tx+a, w.ty+b]).filter(([a,b]) => get(a,b)?.k === 'road');
    if (opts.length > 1) opts = opts.filter(([a,b]) => a !== w.lx || b !== w.ly);
    if (opts.length){ const o = opts[Math.floor(Math.random()*opts.length)]; w.lx = w.tx; w.ly = w.ty; w.dx = o[0] - w.tx; w.dy = o[1] - w.ty; w.tx = o[0]; w.ty = o[1]; }
  } else { const st = Math.min(d, dt*speed); w.fx += dx/d*st; w.fy += dy/d*st; }
}
function spawnMover(list, want, mk){
  const rs = roads();
  while (list.length < want && rs.length){ const i = rs[Math.floor(Math.random()*rs.length)], x = i%W, y = (i/W)|0; list.push(Object.assign({ fx:x, fy:y, tx:x, ty:y, lx:x, ly:y, dx:1, dy:0 }, mk(list.length))); }
  if (list.length > want) list.length = want;
  return list.filter(w => get(w.tx,w.ty)?.k === 'road');
}
function updMovers(dt){
  const stay = S.weather === 4 ? .25 : S.weather === 5 ? .6 : 1;
  const wantW = Math.min(40, Math.floor(ST.pop/8*stay) + (S.evt?.k === 'tour' && S.evt.done ? 8 : 0) + (festival() ? 10 : 0));
  walkers = spawnMover(walkers, wantW, n => ({ c:SHIRTS[n % SHIRTS.length], ox:Math.floor(Math.random()*6), oy:Math.floor(Math.random()*5) }));
  for (const w of walkers) stepMover(w, .8, dt);
  const wantC = S.weather === 4 ? 0 : Math.min(36, Math.floor(ST.pop/25));
  cars = spawnMover(cars, wantC, n => ({ c:CAR_COLS[n % CAR_COLS.length] }));
  const sp = 2.4*(1 - ST.cong*.75)*(S.weather === 5 ? .7 : 1);
  for (const c of cars) stepMover(c, sp, dt);
}
function drawMovers(){
  for (const w of walkers){
    const px = Math.round(w.fx*T) + 4 + w.ox, py = M + Math.round(w.fy*T) + 4 + w.oy;
    g.fillStyle = '#f1c9a0'; g.fillRect(px, py, 2, 1);

  }
  for (let py=0; py<PR; py++) for (let px=0; px<PC; px++){
    if (S.own[pidx(px,py)]) continue;
    const X = px*PS*T, Y = M + py*PS*T;
    g.fillStyle = 'rgba(6,12,20,.4)'; g.fillRect(X, Y, PS*T, PS*T);

  }
  let d = dark();

  if (d > 0){
    g.fillStyle = `rgba(16,20,58,${d})`; g.fillRect(0,0,WW,WH);
    if (d > .2 && !blackout()){

  for (const p of fw){ g.globalAlpha = Math.min(1, p.life); g.fillStyle = p.col; g.fillRect(p.x|0, p.y|0, 1, 1); }

/* camera */
let dpr = 1, camTouched = false; const cam = { x:0, y:0, s:2 };
function resize(){
  if (!S) return;
  dpr = window.devicePixelRatio || 1;
  const r = cv.getBoundingClientRect();
  const nw = Math.max(1, Math.round(r.width*dpr)), nh = Math.max(1, Math.round(r.height*dpr));
  if (nw === cv.width && nh === cv.height) return;
  const cx = (cv.width/2 - cam.x)/cam.s, cy = (cv.height/2 - cam.y)/cam.s;
  cv.width = nw; cv.height = nh;
  if (!camTouched) fit(); else { cam.x = nw/2 - cx*cam.s; cam.y = nh/2 - cy*cam.s; clampCam(); }
}
function fit(){
  let x0 = W, x1 = 0, y0 = H, y1 = 0;
  for (let py=0; py<PR; py++) for (let px=0; px<PC; px++) if (S.own[pidx(px,py)]){ x0 = Math.min(x0, px*PS); x1 = Math.max(x1, px*PS+PS); y0 = Math.min(y0, py*PS); y1 = Math.max(y1, py*PS+PS); }
  const ow = (x1-x0)*T, oh = (y1-y0)*T;
  cam.s = Math.max(1, Math.ceil(Math.min(cv.width/ow, cv.height/oh) - .1));
  cam.x = cv.width/2 - ((x0+x1)/2*T)*cam.s; cam.y = cv.height/2 - (M + (y0+y1)/2*T)*cam.s; clampCam();
}
function panTo(x,y){ camTouched = true; cam.x = cv.width/2 - (x*T+8)*cam.s; cam.y = cv.height/2 - (M + y*T)*cam.s; clampCam(); }
function clampCam(){
  const ww = WW*cam.s, wh = WH*cam.s;
  cam.x = ww <= cv.width ? (cv.width-ww)/2 : Math.min(0, Math.max(cv.width-ww, cam.x));
  cam.y = wh <= cv.height ? (cv.height-wh)/2 : Math.min(0, Math.max(cv.height-wh, cam.y));
}
function zoom(dir, ax = cv.width/2, ay = cv.height/2){
  const ns = Math.min(10, Math.max(1, cam.s + dir)); if (ns === cam.s) return; camTouched = true;
  cam.x = ax - (ax - cam.x)*(ns/cam.s); cam.y = ay - (ay - cam.y)*(ns/cam.s); cam.s = ns; clampCam();
}
new ResizeObserver(resize).observe(cv);
function drawMap(){
  mctx.setTransform(1,0,0,1,0,0);
  mctx.fillStyle = '#151726'; mctx.fillRect(0,0,cv.width,cv.height);
  mctx.imageSmoothingEnabled = false;
  const j = mapShake > 0 ? cam.s*2 : 0;
  const sx = j ? Math.round((Math.random()-.5)*j*2) : 0, sy = j ? Math.round((Math.random()-.5)*j) : 0;
  mctx.drawImage(world, Math.round(cam.x) + sx, Math.round(cam.y) + sy, WW*cam.s, WH*cam.s);
}

/* ---------- tools & input ---------- */
const TOOL_ORDER = ['look','build','road','park','shop','school','factory','big','landmark','land','bulldoze'];
let tool = 'look';

  hidePanel();

  const tips = { build:'點一塊旁邊有道路的空地，開始疊房子', road:'按住拖曳可以連續鋪路；蓋在河上會變成橋（25 金）', park:'公園讓附近 3 格的住戶更幸福',
    shop:'商店讓附近 4 格的住戶更幸福，也會賺錢', school:'學校讓附近 5 格的住戶幸福 +10', factory:'工廠很會賺錢，但 2 格內的住戶會因為污染不開心',

  if (tips[t]) toast(tips[t]);
}
document.querySelectorAll('.tool').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
function updToolLocks(){
  for (const k in UNLOCK){ const b = document.querySelector(`.tool[data-tool="${k}"]`); const lock = ST.pop < UNLOCK[k];
    b.classList.toggle('locked', lock); b.querySelector('small').textContent = lock ? `人口 ${UNLOCK[k]} 解鎖` : `${COST[k]} 金`; }
  for (const k of ['big','land']){ const b = document.querySelector(`.tool[data-tool="${k}"]`), lock = (S.level || 0) < 1;
    b.classList.toggle('locked', lock); b.querySelector('small').textContent = lock ? '小鎮解鎖' : k === 'big' ? '2×2' : `${landPrice()} 金`; }
}
const parcelAdj = (px,py) => N4.some(([a,b]) => { const X = px+a, Y = py+b; return X >= 0 && Y >= 0 && X < PC && Y < PR && S.own[pidx(X,Y)]; });
const landPrice = () => 200 + 100*(S.bought || 0);
function canBig(x,y){ for (let dy=0; dy<2; dy++) for (let dx=0; dx<2; dx++){ const X = x+dx, Y = y+dy; if (!owned(X,Y) || get(X,Y) || terr(X,Y) === 1) return false; } return true; }
function buildable(x,y){ return owned(x,y) && terr(x,y) !== 1; }
function toolValid(x,y){
  const t = get(x,y);
  if (tool === 'road') return owned(x,y) && !t && S.coins >= (terr(x,y) === 1 ? BRIDGE : COST.road);
  if (COST[tool]) return buildable(x,y) && !t && S.coins >= COST[tool] && !(UNLOCK[tool] && ST.pop < UNLOCK[tool]);
  if (tool === 'build') return buildable(x,y) && (!t || t.k === 'bld');
  if (tool === 'landmark') return buildable(x,y) && (!t || t.k === 'lm');
  if (tool === 'big') return canBig(x,y);
  if (tool === 'land') return !owned(x,y) && parcelAdj((x/PS)|0, (y/PS)|0);
  if (tool === 'bulldoze') return !!t && owned(x,y);
  return true;
}
function tileAt(e){
  const r = cv.getBoundingClientRect();
  const px = (e.clientX - r.left)*dpr, py = (e.clientY - r.top)*dpr;
  const wx = (px - cam.x)/cam.s, wy = (py - cam.y)/cam.s;
  return { x:Math.floor(wx/T), y:Math.floor((wy - M)/T) };
}
const pointers = new Map();
let drag = null, lastPaint = -1, pinch = null;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pointers.size === 2){
    const [a,b] = [...pointers.values()];
    pinch = { d:Math.hypot(a.x-b.x, a.y-b.y), s:cam.s }; drag = null; return;
  }
  drag = { x:e.clientX, y:e.clientY, cx:cam.x, cy:cam.y, moved:false, paint: tool === 'road' };
  lastPaint = -1; if (drag.paint) paintRoad(tileAt(e));
});
cv.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pinch && pointers.size === 2){
    const [a,b] = [...pointers.values()], d = Math.hypot(a.x-b.x, a.y-b.y);
    const target = Math.round(pinch.s * d/pinch.d);
    if (target !== cam.s){ const r = cv.getBoundingClientRect(); zoom(target > cam.s ? 1 : -1, ((a.x+b.x)/2 - r.left)*dpr, ((a.y+b.y)/2 - r.top)*dpr); }
    return;
  }
  const tl = tileAt(e); hover = e.pointerType === 'mouse' ? tl : null;
  if (!drag) return;
  if (drag.paint){ paintRoad(tl); return; }
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.hypot(dx,dy) > 6) drag.moved = true;
  if (drag.moved){ camTouched = true; cam.x = drag.cx + dx*dpr; cam.y = drag.cy + dy*dpr; clampCam(); }
});
const endPointer = e => {
  pointers.delete(e.pointerId);
  if (pinch){ if (pointers.size < 2) pinch = null; drag = null; return; }
  if (e.type === 'pointerup' && drag && !drag.moved && !drag.paint){ const t = tileAt(e); tapTile(t.x, t.y); }
  drag = null;
};
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);
cv.addEventListener('pointerleave', () => { hover = null; });
cv.addEventListener('wheel', e => { e.preventDefault(); const r = cv.getBoundingClientRect(); zoom(e.deltaY < 0 ? 1 : -1, (e.clientX-r.left)*dpr, (e.clientY-r.top)*dpr); }, { passive:false });
$('#zin').onclick = () => zoom(1); $('#zout').onclick = () => zoom(-1);

function paintRoad(t){

}

      msg = `<h3>${head}</h3><p>${tier.name}現在有 <b>${n}</b> 層（這次 +${added}）</p><p>可住 ${(n + hv)*tier.pop} 人 · 精準度 ${Math.round(p*100)}%</p>${SM.earned ? `<p>完美獎勵 +${SM.earned} 金</p>` : ''}${p < .65 ? '<p class="no">精準度偏低，地震時容易倒樓。</p>' : ''}${roadAdj(SM.x,SM.y) ? '' : '<p class="no">記得幫它接上道路，居民才會搬進來。</p>'}`;
      if (SM.t >= 1 && reason !== 'collapse' && SM.lastPerfect){
        msg += `<p>完美收尾！選一個屋頂裝飾：</p><div class="btnrow">${Object.entries(ROOFS).map(([k,v]) => `<button type="button" data-act="roof" data-r="${k}" title="${v.d}">${v.n}</button>`).join('')}</div><p class="dimtxt">花園：這棟幸福 +5 · 停機坪：每小時 +2 金 · 霓虹：每小時 +1 金</p>`;
      }
      beep(660,.12,'triangle'); setTimeout(() => beep(880,.18,'triangle'), 120);
    }
    changed(); saveNow();
    r.innerHTML = msg + '<div class="btnrow"><button type="button" data-act="back">回到城市</button></div>';
  }
  r.hidden = false; $('#sfinish').hidden = true;
  setTimeout(() => r.querySelector('[data-act="back"]')?.focus(), 50);
}
function closeStack(){
  if (!SM) return;
  const ch = SM.ch, x = SM.x, y = SM.y; SM = null; $('#stack').hidden = true;
  if (ch) showDaily(); else { sel = { x, y }; showInfo(x, y); }
}
$('#sres').addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || !SM) return;
  const a = b.dataset.act;
  if (a === 'back') closeStack();
  else if (a === 'retry'){ const c = SM.ch; SM = null; startStack(-1, -1, c.tier, null, 0, c); }
  else if (a === 'copy'){
    const txt = $('#shareTxt').textContent;
    const done = () => { b.textContent = '已複製'; };
    try { navigator.clipboard.writeText(txt).then(done, () => { selectText($('#shareTxt')); b.textContent = '請手動複製'; }); }
    catch { selectText($('#shareTxt')); b.textContent = '請手動複製'; }
  } else if (a === 'roof'){
    const t = get(SM.x, SM.y); if (t?.k !== 'bld') return;
    t.roof = b.dataset.r; changed(); saveNow();
    b.parentElement.innerHTML = `<p class="ok">已裝上${ROOFS[t.roof].n}！</p>`;
    beep(988,.15,'triangle');
  }
});
function selectText(el){ try { const r = document.createRange(); r.selectNodeContents(el); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } catch {} }
$('#sfinish').onclick = () => endStack('finish');
sc.addEventListener('pointerdown', e => { e.preventDefault(); drop(); });

function mix(a, b, t){
  const pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16);
  const ch = s => Math.round(((pa>>s)&255)*(1-t) + ((pb>>s)&255)*t);
  return '#' + [16,8,0].map(s => ch(s).toString(16).padStart(2,'0')).join('');
}
function sBlock(l, y, w, h, tier, i, lit, kind){
  const c = sctx, fc = floorColors(tier, kind); l = Math.round(l); w = Math.max(1, Math.round(w)); y = Math.round(y);
  c.fillStyle = fc.wall; c.fillRect(l, y, w, h);
  c.fillStyle = fc.wallD; c.fillRect(l + w - 2, y, 2, h); c.fillRect(l, y + h - 2, w, 2);
  if (kind === 'h'){ c.fillStyle = '#26262e'; c.fillRect(l, y, w, 1); c.fillRect(l, y + h - 3, w, 1); }
  const wh = h >= 11 ? h - 7 : h - 5, wy = h >= 11 ? y + 3 : y + 2;
  for (let wx = l + 3; wx + 3 <= l + w - 3; wx += 7){
    c.fillStyle = kind === 'g' ? GOLD.win : lit && hash(wx*3 + i, i*7) < .6 ? '#ffd966' : fc.win;
    c.fillRect(wx, wy, 3, Math.max(1, wh));
  }
  if (kind === 'g' && Math.floor(now*8 + i) % 3 === 0){ c.fillStyle = '#ffffff'; c.fillRect(l + Math.floor(hash(i, Math.floor(now*8))*w), y + 1, 1, 1); }
}
function updStack(dt){
  if (!SM) return;
  const c = SM.cur, E = env();
  if (c){
    const mult = 1 + E.wind*E.windDir*Math.sign(c.v);
    c.l += c.v*mult*dt;
    if (c.l < 0){ c.l = 0; c.v = Math.abs(c.v); }
    if (c.l > SW - c.w){ c.l = SW - c.w; c.v = -Math.abs(c.v); }
  }
  for (const d of SM.debris){ d.vy += 500*dt; d.y += d.vy*dt; }
  SM.debris = SM.debris.filter(d => d.y < GROUND + 200);
  for (const p of SM.parts){ p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 160*dt; p.life -= dt; }
  SM.parts = SM.parts.filter(p => p.life > 0);
  SM.camY += (camTarget() - SM.camY)*Math.min(1, dt*6);
  SM.shake = Math.max(0, SM.shake - dt);
}
function renderStack(){
  if (!SM) return;
  const c = sctx, tier = TIERS[SM.t], bh = tier.bh, cy = Math.round(SM.camY), E = env(), sea = SEASONS[season()];
  let d = dark(); if (E.weather === 4) d = Math.max(d, .35);
  const sx = SM.shake ? Math.round((Math.random()-.5)*4) : 0;
  c.setTransform(1,0,0,1,sx,0);
  const bands = 8;
  for (let i=0; i<bands; i++){
    c.fillStyle = mix(mix('#7fc4e6', '#cfeaf5', i/bands), mix('#141a3c', '#3a3566', i/bands), Math.min(1, d/.62));
    c.fillRect(-4, Math.floor(i*SH/bands), SW+8, Math.ceil(SH/bands)+1);
  }
  if (SM.combo >= 5){ c.fillStyle = `hsla(${Math.floor(now*120) % 360},90%,60%,.12)`; c.fillRect(-4, 0, SW+8, SH); }
  if (d > .3){ c.fillStyle = '#fff6d0'; for (let i=0; i<24; i++) c.fillRect(Math.floor(hash(i,40)*SW), Math.floor(hash(i,41)*SH*.6), 1, 1); }
  const cloudX = (now*8*E.windDir*(1 + E.wind*4)) % (SW + 60);
  c.fillStyle = d > .3 ? 'rgba(200,200,230,.25)' : 'rgba(255,255,255,.85)';
  for (let k=0; k<3; k++){ const x = ((k*70 + cloudX) % (SW+60) + SW + 60) % (SW+60) - 40, y = 20 + k*38 + Math.round(cy*.15); c.fillRect(x, y, 26, 5); c.fillRect(x+5, y-3, 14, 3); }
  const par = Math.round(cy*.35);
  for (let i=0; i<13; i++){
    const h = 18 + Math.floor(hash(i,9)*46), x = i*13 - 4;
    c.fillStyle = d > .3 ? '#262c52' : '#9fb8c9'; c.fillRect(x, GROUND - h + par, 12, h + 30);
    if (sea.snow){ c.fillStyle = '#f4f8fa'; c.fillRect(x, GROUND - h + par, 12, 2); }
    if (d > .3){ c.fillStyle = '#e3c76a'; for (let k=0; k<3; k++) if (hash(i,k+20) < .5) c.fillRect(x + 3 + k*3, GROUND - h + par + 4 + k*5, 1, 1); }
  }
  c.fillStyle = sea.grass[0]; c.fillRect(-4, GROUND + cy, SW+8, SH);
  c.fillStyle = sea.dots[2]; c.fillRect(-4, GROUND + cy, SW+8, 2);
  c.fillStyle = '#7a776f'; c.fillRect(BASEL - 3, GROUND + cy, BASEW + 6, 4);
  const lit = d > .25;
  SM.floors.forEach((f,i) => sBlock(f.l, GROUND - (i+1)*bh + cy, f.w, bh, tier, i, lit, f.s));
  if (SM.cur){
    const t = topF(), yy = GROUND - (SM.floors.length+1)*bh + cy;
    c.fillStyle = 'rgba(255,255,255,.18)';
    c.fillRect(Math.round(t.l), yy - 30, 1, 30 + bh); c.fillRect(Math.round(t.l + t.w) - 1, yy - 30, 1, 30 + bh);
    sBlock(SM.cur.l, yy, SM.cur.w, bh, tier, SM.floors.length, lit, SM.cur.kind);
  }
  for (const db of SM.debris) sBlock(db.l, db.y + cy, db.w, bh, tier, 0, false, db.s);
  for (const p of SM.parts){ c.globalAlpha = Math.min(1, p.life*1.5); c.fillStyle = p.col; c.fillRect(Math.round(p.x), Math.round(p.y + cy), 2, 2); }
  c.globalAlpha = 1;
  const w = WEATHER[E.weather];
  if (w.rain){
    c.fillStyle = 'rgba(200,215,255,.6)';
    for (let i=0; i<(E.weather === 4 ? 70 : 40); i++){ const x = (hash(i,3)*SW + now*(E.weather === 4 ? 120 : 30)*E.windDir) % SW, y = (hash(i,5)*SH + now*180) % SH; c.fillRect((x+SW)%SW|0, y|0, 1, 4); }
  } else if (w.snow){
    c.fillStyle = 'rgba(255,255,255,.9)';
    for (let i=0; i<60; i++){ const x = (hash(i,3)*SW + Math.sin(now + i)*8 + SW) % SW, y = (hash(i,5)*SH + now*30*(.6 + hash(i,9))) % SH; c.fillRect(x|0, y|0, 2, 2); }
  }
  if (E.wind >= .4){
    c.fillStyle = 'rgba(255,255,255,.5)';
    for (let i=0; i<6; i++){ const y = 30 + i*28, x = ((hash(i,8)*SW + now*90*E.windDir*(E.wind/.5)) % (SW+30) + SW + 30) % (SW+30) - 20; c.fillRect(x|0, y, 14, 1); }
  }
  if (SM.combo >= 5){
    c.strokeStyle = `hsl(${Math.floor(now*300) % 360},95%,62%)`; c.lineWidth = SM.combo >= 8 ? 3 : 2;
    c.strokeRect(1, 1, SW-2, SH-2);
  }
  c.setTransform(1,0,0,1,0,0);
}

/* ---------- HUD ---------- */
function evtLabel(){
  const e = S.evt; if (!e) return '';
  if (e.k === 'typhoon') return '颱風警報';
  if (e.k === 'market') return '市集日';
  if (e.k === 'tour' && e.done) return '觀光團';
  if (e.k === 'blackout' && e.done && !e.end) return '停電中';
  if (e.k === 'fireworks' && e.done) return '煙火節';
  return '';
}
function hud(){
  $('#coins').textContent = Math.floor(S.coins);
  $('#inc').textContent = `+${ST.inc.toFixed(1)}/時`;
  $('#pop').textContent = ST.pop;
  $('#hap').textContent = ST.pop ? ST.happy + '%' : '—';
  const tl = trafficLabel(), te = $('#trf'); te.textContent = tl; te.style.color = ST.cong < .05 ? '' : ST.cong < .5 ? 'var(--gold)' : 'var(--bad)';
  $('#lvl').textContent = LEVELS[S.level || 0].n;
  const m = Math.floor(S.min % 1440);
  $('#clock').textContent = `${SEASONS[season()].n} · 第 ${dayNo()} 天 ${pad((m/60)|0)}:${pad(m%60)}`;
  $('#wx').textContent = WEATHER[S.weather].n + (S.wind ? (S.windDir > 0 ? ' →' : ' ←') : '');
  const ev = evtLabel(), pol = policy();
  $('#evt').textContent = [ev, pol ? POLICIES[pol].n : ''].filter(Boolean).map(s => '· ' + s).join(' ');
  updToolLocks(); reqTick(); checkGoals();
}

/* ---------- keyboard ---------- */
addEventListener('keydown', e => {
  if (SM){
    if (!SM.over && (e.code === 'Space' || e.code === 'Enter')){ e.preventDefault(); drop(); }
    else if (e.key === 'Escape'){ SM.over ? closeStack() : endStack('finish'); }
    return;
  }
  if (e.target.closest && e.target.closest('button') && (e.code === 'Space' || e.code === 'Enter')) return;
  const step = 48*dpr, k = e.key;
  if (k === 'ArrowLeft' || k === 'a'){ camTouched = true; cam.x += step; clampCam(); }
  else if (k === 'ArrowRight' || k === 'd'){ camTouched = true; cam.x -= step; clampCam(); }
  else if (k === 'ArrowUp' || k === 'w'){ camTouched = true; cam.y += step; clampCam(); }
  else if (k === 'ArrowDown' || k === 's'){ camTouched = true; cam.y -= step; clampCam(); }
  else if (k === '+' || k === '='){ zoom(1); }
  else if (k === '-'){ zoom(-1); }
  else if (k === 'Escape'){ hidePanel(); }
  else if (k.length === 1 && k >= '1' && k <= '9'){ setTool(TOOL_ORDER[+k-1]); }
  else if (k === '0'){ setTool(TOOL_ORDER[9]); }
});

/* ---------- loop & boot ---------- */
function resetWorld(){ walkers = []; cars = []; fw = []; ufo = null; camTouched = false; groundKey = ''; changed(); fit(); }
let last = performance.now(), hudAcc = 0;
function frame(ts){
  const dt = Math.min(.05, (ts - last)/1000); last = ts; now = ts/1000;
  tick(dt); updMovers(dt); updStack(dt); updUfo(dt); updFireworks(dt);
  mapShake = Math.max(0, mapShake - dt);
  renderWorld(dt); drawMap(); renderStack();
  hudAcc += dt; if (hudAcc > .2){ hudAcc = 0; hud(); }
  requestAnimationFrame(frame);
}
function start(data){
  S = sanitize(data && data.S) || sanitize(loadLocal()) || newGame();
  const fresh = !S.savedAt && !S.grid.some(t => t?.k === 'bld');
  $('#musicBtn').textContent = `音樂 ${prefs.music ? '開' : '關'}`;
  compute(); resize(); hud();
  if (S.savedAt){ const d = new Date(S.savedAt); $('#saved').textContent = `已存檔（本機）${pad(d.getHours())}:${pad(d.getMinutes())}`; }
  if (fresh) showHelp();
  requestAnimationFrame(t => { last = t; frame(t); });
  connectCloud();
}
try { window.claude?.hot?.snapshot?.(() => ({ S })); } catch {}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
