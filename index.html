<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}</style>
</head>
<body>
<title>像素疊城</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: one-screen game. HUD strip on top, pixel city map in the middle (quest card top-left, panels top-right), tool tray at the bottom; stacking opens as an overlay. Single dark "night console" theme by choice. */
:root{
  --bg:#151726; --panel:#222538; --panel2:#2d3150; --edge:#0b0c16;
  --ink:#efe6cf; --dim:#9d9bb0; --gold:#f4b941; --good:#86d17a; --bad:#ee6a5f;
  --pix:"DotGothic16","Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--pix);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column}
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding-block:8px;padding-inline:16px;background:var(--panel);box-shadow:0 3px 0 var(--edge);z-index:2}
.stat{display:flex;gap:6px;align-items:baseline;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat .k{color:var(--dim);font-size:13px;letter-spacing:.05em}
.stat b{font-weight:400;color:var(--ink)}
#coins{color:var(--gold)}
#inc{color:var(--good);font-size:13px}
#evt{color:var(--gold);font-size:13px}
.spacer{flex:1}
#saved{font-size:12px;color:var(--dim)}
#view{position:relative;flex:1;min-height:0}
#map{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none;cursor:crosshair}
#tools{display:flex;gap:8px;padding-block:10px;padding-inline:16px;overflow-x:auto;background:var(--panel);box-shadow:0 -3px 0 var(--edge);z-index:2}
button{font:inherit;color:var(--ink);background:var(--panel2);border:0;padding:8px 12px;cursor:pointer;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.4),inset 3px 3px 0 rgba(255,255,255,.1),0 0 0 2px var(--edge)}
button:hover{filter:brightness(1.15)}
button:active{box-shadow:inset 3px 3px 0 rgba(0,0,0,.4),0 0 0 2px var(--edge)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed;filter:none}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:60px;flex:0 0 auto}
.tool small{font-size:11px;color:var(--dim)}
.tool.on{background:var(--gold);color:#2a1d05}
.tool.on small{color:#5a3f0a}
.tool.locked{opacity:.55}
.zoom{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px}
.zoom button{width:40px;height:40px;padding:0;font-size:20px}
#quest{position:absolute;left:16px;top:16px;max-width:min(320px,calc(100% - 32px));background:rgba(11,12,22,.86);padding:8px 12px;box-shadow:0 0 0 2px var(--panel2);
  display:flex;flex-direction:column;gap:2px;line-height:1.4;pointer-events:none}
#quest .k{color:var(--dim);font-size:12px;letter-spacing:.05em}
#quest .rw{color:var(--gold);font-size:13px}
#quest.done{box-shadow:0 0 0 2px var(--gold)}
.panel{position:absolute;right:16px;top:16px;width:min(320px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:var(--panel);padding:14px 16px;
  box-shadow:0 0 0 3px var(--edge),6px 6px 0 rgba(0,0,0,.45);display:flex;flex-direction:column;gap:8px;z-index:3}
.panel h3{margin:0;font-weight:400;font-size:18px;color:var(--gold)}
.panel p{margin:0;line-height:1.55}
.panel .row{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.ok{color:var(--good)} .no{color:var(--bad)} .dimtxt{color:var(--dim);font-size:13px}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.pick small{color:var(--dim);font-size:12px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
.ach{display:flex;gap:10px;align-items:flex-start;padding-block:4px}
.ach i{flex:0 0 14px;height:14px;margin-top:3px;background:var(--panel2);box-shadow:0 0 0 2px var(--edge)}
.ach.got i{background:var(--gold)}
.ach div{display:flex;flex-direction:column;min-width:0}
.ach small{color:var(--dim);font-size:12px}
.ach:not(.got) b{color:var(--dim)}
.ach b{font-weight:400}
.log{display:flex;flex-direction:column;gap:6px}
.log p{font-size:13px}
.log span{color:var(--dim)}
#toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);max-width:calc(100% - 96px);background:var(--edge);color:var(--ink);padding:8px 14px;
  box-shadow:0 0 0 2px var(--gold);pointer-events:none;opacity:0;transition:opacity .25s;text-align:center;line-height:1.4;z-index:4}
#toast.show{opacity:1}
#toast.alert{box-shadow:0 0 0 2px var(--bad)}
#stack{position:fixed;inset:0;background:rgba(8,9,18,.8);display:flex;align-items:center;justify-content:center;padding-inline:16px;z-index:10}
.sbox{background:var(--panel);padding:14px;box-shadow:0 0 0 3px var(--edge),8px 8px 0 rgba(0,0,0,.5);display:flex;flex-direction:column;gap:10px;align-items:center;max-width:100%}
#shead{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-variant-numeric:tabular-nums}
#shead .k{color:var(--dim);font-size:13px}
.swrap{position:relative}
#sc{display:block;height:min(62vh,480px);aspect-ratio:2/3;max-width:calc(100vw - 60px);image-rendering:pixelated;touch-action:none;cursor:pointer;box-shadow:0 0 0 2px var(--edge)}
#sflash{position:absolute;left:0;right:0;top:18%;text-align:center;font-size:22px;color:var(--gold);text-shadow:2px 2px 0 var(--edge);opacity:0;transition:opacity .4s,transform .4s;pointer-events:none}
#sflash.show{opacity:1;transform:translateY(-8px);transition:none}
#sres{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(11,12,22,.78);text-align:center;padding:16px}
#sres h3{margin:0;font-weight:400;color:var(--gold);font-size:22px}
#sres p{margin:0;line-height:1.6}
.shint{margin:0;color:var(--dim);font-size:13px;text-align:center}
@media (prefers-reduced-motion:reduce){#toast,#sflash{transition:none}}
</style>

<div id="app">
  <header id="hud">
    <div class="stat"><span class="k">金幣</span><b id="coins">0</b><span id="inc"></span></div>
    <div class="stat"><span class="k">人口</span><b id="pop">0</b></div>
    <div class="stat"><span class="k">幸福</span><b id="hap">—</b></div>
    <div class="stat"><b id="clock">第 1 天 07:00</b></div>
    <div class="stat"><span class="k">天氣</span><b id="wx">晴天</b><span id="evt"></span></div>
    <div class="spacer"></div>
    <span id="saved">尚未存檔</span>
    <button id="musicBtn" type="button" aria-label="音樂開關">音樂 開</button>
    <button id="menuBtn" type="button">選單</button>
  </header>
  <main id="view">
    <canvas id="map" aria-label="城市地圖"></canvas>
    <div id="quest" aria-live="polite"></div>
    <div class="zoom"><button id="zin" type="button" aria-label="放大">+</button><button id="zout" type="button" aria-label="縮小">−</button></div>
    <div id="info" class="panel" hidden></div>
    <div id="toast" role="status"></div>
  </main>
  <nav id="tools">
    <button class="tool on" data-tool="look" type="button">查看<small>點選格子</small></button>
    <button class="tool" data-tool="build" type="button">蓋樓<small>疊疊樂</small></button>
    <button class="tool" data-tool="road" type="button">道路<small>5 金/格</small></button>
    <button class="tool" data-tool="park" type="button">公園<small>30 金</small></button>
    <button class="tool" data-tool="shop" type="button">商店<small>60 金</small></button>
    <button class="tool" data-tool="school" type="button">學校<small>120 金</small></button>
    <button class="tool" data-tool="factory" type="button">工廠<small>150 金</small></button>
    <button class="tool" data-tool="landmark" type="button">地標<small>獨一無二</small></button>
    <button class="tool" data-tool="bulldoze" type="button">拆除<small>免費</small></button>
  </nav>
</div>

<div id="stack" hidden>
  <div class="sbox">
    <div id="shead"></div>
    <div class="swrap">
      <canvas id="sc" width="160" height="240" aria-label="疊樓畫面"></canvas>
      <div id="sflash"></div>
      <div id="sres" hidden></div>
    </div>
    <div class="btnrow"><button id="sfinish" type="button">完工</button></div>
    <p class="shint">點畫面或按空白鍵放下樓層。對齊下面那層就是「完美」。</p>
  </div>
</div>

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);
const W = 28, H = 20, T = 16, M = 96, WW = W * T, WH = M + H * T;
const TIERS = [
  { name:'木屋', cost:20,  max:5,  pop:2, fh:3, bh:14, speed:46, unlock:0,   wall:'#e3b98c', wallD:'#b0825a', roof:'#c4503a', roofL:'#e3735c', win:'#5d7fa8' },
  { name:'公寓', cost:80,  max:15, pop:4, fh:3, bh:11, speed:58, unlock:50,  wall:'#c98f6a', wallD:'#935e43', roof:'#5b5e70', roofL:'#80849a', win:'#4f6d93' },
  { name:'大樓', cost:300, max:40, pop:6, fh:2, bh:8,  speed:70, unlock:250, wall:'#86b6d6', wallD:'#4f7ea6', roof:'#3a3f55', roofL:'#5c6380', win:'#2f5375' },
];
const WEATHER = [ {n:'晴天', w:0}, {n:'多雲', w:.12}, {n:'下雨', w:.2, rain:1}, {n:'強風', w:.5}, {n:'颱風', w:.8, rain:1} ];
const COST = { road:5, park:30, shop:60, school:120, factory:150 };
const UNLOCK = { school:20, factory:40 };
const NAMES = { road:'道路', park:'公園', shop:'商店', school:'學校', factory:'工廠' };
const LANDMARKS = [
  { name:'鐘塔',     cost:500,  unlock:100, tour:4,  desc:'全城幸福 +5，每小時觀光收入 +4' },
  { name:'摩天輪',   cost:1200, unlock:200, tour:10, desc:'全城幸福 +5，每小時觀光收入 +10' },
  { name:'像素巨塔', cost:3000, unlock:400, tour:25, desc:'全城幸福 +5，每小時觀光收入 +25' },
];
const N4 = [[1,0],[-1,0],[0,1],[0,-1]];
const LS = 'pixel-stack-city-v1', PREFS = 'pixel-stack-city-prefs';
const idx = (x,y) => y*W + x, inb = (x,y) => x>=0 && y>=0 && x<W && y<H;
const get = (x,y) => inb(x,y) ? S.grid[idx(x,y)] : null;
const pad = n => String(n).padStart(2,'0');
const dayNo = () => Math.floor(S.min/1440) + 1;
function hash(x,y){ let h = Math.imul(x|0,374761393) + Math.imul(y|0,668265263); h = Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967296; }
function rng(seed){ return () => { seed = (Math.imul(seed,1664525)+1013904223)>>>0; return seed/4294967296; }; }

let S, ST = { pop:0, happy:0, inc:0, res:{}, cnt:{}, maxF:[0,0,0] };

function newGame(){
  const r = rng((Date.now() & 0xffffff) | 1);
  const s = { v:2, coins:150, min:7*60, weather:0, wind:0, windDir:1, unlock:0, grid:new Array(W*H).fill(null), savedAt:0,
              quest:0, ach:{}, st:{}, log:[], evt:null };
  for (let x=0; x<W; x++) s.grid[idx(x,9)] = { k:'road' };
  for (let i=0; i<48; i++){ const x = Math.floor(r()*W), y = Math.floor(r()*H); if (Math.abs(y-9) < 2) continue; if (!s.grid[idx(x,y)]) s.grid[idx(x,y)] = { k:'tree' }; }
  return s;
}
function sanitize(o){
  if (!o || typeof o !== 'object' || !Array.isArray(o.grid) || o.grid.length !== W*H) return null;
  const s = Object.assign(newGame(), o);
  s.ach = s.ach || {}; s.st = s.st || {}; s.log = Array.isArray(s.log) ? s.log : [];
  return s;
}
function addLog(msg){ S.log.push({ d:dayNo(), m:msg }); if (S.log.length > 30) S.log.shift(); }

/* ---------- city rules ---------- */
const roadAdj = (x,y) => N4.some(([a,b]) => get(x+a,y+b)?.k === 'road');
function near(x,y,r,k){ for (let dy=-r; dy<=r; dy++) for (let dx=-r; dx<=r; dx++){ if (Math.abs(dx)+Math.abs(dy) > r) continue; if (get(x+dx,y+dy)?.k === k) return true; } return false; }
function popNear(x,y,r){ let c = 0; for (const k in ST.res){ const e = ST.res[k]; if (!e.res) continue; const bx = k%W, by = (k/W)|0; if (Math.abs(bx-x)+Math.abs(by-y) <= r) c += e.res; } return c; }
function evalB(x,y,t){
  const road = roadAdj(x,y), park = near(x,y,3,'park'), shop = near(x,y,4,'shop'), school = near(x,y,5,'school'), smog = near(x,y,2,'factory');
  const lm = (ST.cnt.lm || 0)*5;
  const h = Math.max(0, Math.min(100, 35 + (park?20:0) + (shop?20:0) + (school?15:0) - (smog?20:0) + Math.round((t.p||0)*15) + lm));
  return { road, park, shop, school, smog, lm, h, res: road ? t.f * TIERS[t.t].pop : 0 };
}
function compute(){
  const cnt = { bld:0, park:0, shop:0, school:0, factory:0, lm:0, road:0, tree:0 }, maxF = [0,0,0], lmBuilt = [];
  S.grid.forEach(t => { if (!t) return; cnt[t.k] = (cnt[t.k]||0) + 1; if (t.k === 'bld') maxF[t.t] = Math.max(maxF[t.t], t.f); if (t.k === 'lm') lmBuilt[t.id] = true; });
  ST.cnt = cnt; ST.maxF = maxF; ST.lmBuilt = lmBuilt;
  let pop = 0, hs = 0, resInc = 0; const res = {};
  for (let y=0; y<H; y++) for (let x=0; x<W; x++){
    const t = S.grid[idx(x,y)]; if (t?.k !== 'bld') continue;
    const e = evalB(x,y,t); res[idx(x,y)] = e; pop += e.res; hs += e.h*e.res; resInc += e.res*0.2*(e.h/60);
  }
  ST.res = res;
  const happy = pop ? Math.round(hs/pop) : 0;
  let shopInc = 0, facInc = 0, tourInc = 0;
  for (let y=0; y<H; y++) for (let x=0; x<W; x++){
    const t = S.grid[idx(x,y)], i = idx(x,y);
    if (t?.k === 'shop'){ const road = roadAdj(x,y), c = road ? popNear(x,y,4) : 0, si = Math.min(c,60)*0.08; res[i] = { customers:c, inc:si, road }; shopInc += si; }
    else if (t?.k === 'factory'){ const road = roadAdj(x,y), c = road ? popNear(x,y,6) : 0, fi = Math.min(c,80)*0.15; res[i] = { workers:c, inc:fi, road }; facInc += fi; }
    else if (t?.k === 'lm'){ const ti = LANDMARKS[t.id].tour*(0.5 + happy/100); res[i] = { inc:ti }; tourInc += ti; }
  }
  if (S.evt?.k === 'typhoon' && !S.evt.over) resInc *= .5;
  if (S.evt?.k === 'market') shopInc *= 2;
  ST.pop = pop; ST.happy = happy; ST.inc = resInc + shopInc + facInc + tourInc;
  let u = S.unlock; TIERS.forEach((t,i) => { if (pop >= t.unlock && i > u) u = i; });
  if (u > S.unlock){ S.unlock = u; toast(`解鎖新建築：${TIERS[u].name}！`); beep(880,.25,'triangle'); markDirty(); }
}
function changed(){ roadsCache = null; compute(); markDirty(); scheduleSave(); }
function cutFloors(t, n){
  t.f -= n; t.w.length = t.f; t.o.length = t.f;
  t.p = Math.round(t.w.reduce((a,b) => a+b, 0)/t.f*100)/100;
}

/* ---------- time, weather, events ---------- */
function dark(){
  const h = (S.min % 1440) / 60;
  if (h < 5 || h >= 20.5) return .62;
  if (h < 7) return .62 * (1 - (h-5)/2);
  if (h >= 18) return .62 * ((h-18)/2.5);
  return 0;
}
function newDay(){
  const d = dayNo(), r = Math.random();
  let w = r < .38 ? 0 : r < .6 ? 1 : r < .8 ? 2 : 3;
  if (d >= 4 && Math.random() < .07) w = 4;
  S.weather = w; S.wind = WEATHER[w].w; S.windDir = Math.random() < .5 ? -1 : 1;
  const r2 = Math.random(), hr = a => a + Math.floor(Math.random()*8);
  let evt = null;
  if (w === 4) evt = { k:'typhoon', h:12 };
  else if (d >= 5 && r2 < .08) evt = { k:'quake', h:hr(7) };
  else if (r2 < .08 + (ST.cnt.lm ? .16 : .06)) evt = { k:'tour', h:hr(9) };
  else if (r2 < .34 && ST.cnt.shop) evt = { k:'market', h:8 };
  S.evt = evt;
  if (w === 4){ toast('颱風警報！中午颱風登陸，疊得歪的高樓可能被吹壞。今天居民收入減半。', true); addLog('颱風警報發布'); }
  else {
    const tip = w === 3 ? '（疊樓時會被吹偏）' : w === 2 ? '（地面濕滑，完美判定變嚴格）' : '';
    toast(`第 ${d} 天 · ${WEATHER[w].n}${tip}`);
  }
  compute(); markDirty();
}
let mapShake = 0;
function fireEvent(){
  const e = S.evt; e.done = true;
  if (e.k === 'quake'){
    mapShake = 2.2; beep(70,.8,'sawtooth',.07);
    let lost = 0, hit = 0, total = 0;
    S.grid.forEach(t => {
      if (t?.k !== 'bld') return; total++;
      if (t.p >= .65 || t.f < 2) return;
      const n = Math.min(t.f - 1, 1 + Math.floor(t.f*(.65 - t.p)*1.5));
      if (n > 0){ cutFloors(t, n); lost += n; hit++; }
    });
    const msg = lost ? `地震！${hit} 棟歪樓共倒了 ${lost} 層。疊得越整齊越耐震。` : total ? '地震！所有建築都穩穩撐住了。' : '輕微地震，城裡沒有損失。';
    if (!lost && total >= 3) S.st.quakeSafe = 1;
    toast(msg, true); addLog(msg); changed();
  } else if (e.k === 'typhoon'){
    mapShake = .8; beep(90,.6,'sawtooth',.05);
    let lost = 0, hit = 0, trees = 0;
    S.grid.forEach((t,i) => {
      if (t?.k === 'tree' && Math.random() < .25){ S.grid[i] = null; trees++; return; }
      if (t?.k !== 'bld' || t.f < 6 || t.p >= .7) return;
      const n = Math.min(t.f - 1, 1 + Math.floor(Math.random()*3));
      cutFloors(t, n); lost += n; hit++;
    });
    const msg = `颱風登陸！${hit ? `${hit} 棟高樓被吹掉 ${lost} 層` : '高樓都撐住了'}${trees ? `，吹倒 ${trees} 棵樹` : ''}。`;
    toast(msg, true); addLog(msg); changed();
  } else if (e.k === 'tour'){
    const gain = Math.floor(40 + 120*(ST.cnt.lm||0) + ST.pop*.3);
    S.coins += gain; beep(784,.15,'triangle');
    const msg = `觀光團來玩了！帶來 ${gain} 金。${ST.cnt.lm ? '' : '蓋地標能吸引更多遊客。'}`;
    toast(msg); addLog(msg); markDirty();
  } else if (e.k === 'market'){
    const msg = '今天是市集日，商店收入加倍！';
    toast(msg); addLog(msg);
  }
}
function tick(dt){
  const before = S.min; S.min += dt * 6;
  if (Math.floor(S.min/60) > Math.floor(before/60)) S.coins += ST.inc;
  if (Math.floor(S.min/1440) > Math.floor(before/1440)) newDay();
  if (S.evt && !S.evt.done && (S.min % 1440)/60 >= S.evt.h) fireEvent();
}

/* ---------- quests & achievements ---------- */
const popQ = n => ({ t:`人口達到 ${n}`, ok:() => ST.pop >= n, p:() => `${ST.pop}/${n}` });
const QUESTS = [
  { t:'在道路旁蓋第一棟房子', ok:() => ST.cnt.bld >= 1, r:30 },
  { ...popQ(20), r:50 },
  { t:'蓋一座公園', ok:() => ST.cnt.park >= 1, r:40 },
  { t:'蓋一家商店', ok:() => ST.cnt.shop >= 1, r:60 },
  { t:'疊出一棟 5 層木屋', ok:() => ST.maxF[0] >= 5, p:() => `${ST.maxF[0]}/5`, r:60 },
  { t:'蓋一所學校', ok:() => ST.cnt.school >= 1, r:80 },
  { ...popQ(50), t:'人口達到 50，解鎖公寓', r:100 },
  { t:'一次疊樓連續 5 次完美', ok:() => (S.st.maxCombo||0) >= 5, p:() => `${S.st.maxCombo||0}/5`, r:100 },
  { t:'蓋一座工廠（別太靠近住家）', ok:() => ST.cnt.factory >= 1, r:100 },

function audio(){

function beep(f, d=.08, type='square', vol=.04){
  if (!prefs.sound || !audio()) return;
  try {
    const o = AC.createOscillator(), gn = AC.createGain();
    o.type = type; o.frequency.value = f; gn.gain.value = vol;
    gn.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d);
    o.connect(gn).connect(AC.destination); o.start(); o.stop(AC.currentTime + d);
  } catch {}
}
function note(t, m, d, type, vol){
  const o = AC.createOscillator(), gn = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(440*Math.pow(2,(m-69)/12), t);
  gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vol, t + .012); gn.gain.exponentialRampToValueAtTime(.0001, t + d);

}

  day:   { bpm:116, chords:[[60,64,67],[67,71,74],[69,72,76],[65,69,72]], lead:.62 },
  night: { bpm:76,  chords:[[57,60,64],[53,57,60],[60,64,67],[55,59,62]], lead:.8 },

function musicTick(){
  if (!prefs.music || !AC || !MUS.started || AC.state !== 'running') return;
  if (MUS.next < AC.currentTime) MUS.next = AC.currentTime + .05;
  const song = (S.weather === 4 || mapShake > 0) ? SONGS.storm : dark() > .3 ? SONGS.night : SONGS.day;
  const e8 = 60/song.bpm/2;
  try {
    while (MUS.next < AC.currentTime + .25){
      const s = MUS.step, pos = s % 8, bar = Math.floor(s/8) % 4, phrase = Math.floor(s/32), t = MUS.next, ch = song.chords[bar];
      if (pos === 0 || pos === 4) note(t, ch[0] - 24, e8*3.6, 'triangle', .2);
      if (song === SONGS.night) note(t, ch[pos % 3] + (pos >= 4 ? 12 : 0), e8*1.9, 'triangle', .05);
      else if (pos % 2 === 1) note(t, ch[1], e8*.7, 'square', .018);
      if (song === SONGS.storm && pos % 2 === 0) note(t, 40, e8*.4, 'sawtooth', .02);
      const sec = [0,0,1,0][phrase % 4], hv = hash((s % 32) + sec*97, 3 + sec*13);
      if (hv > song.lead){
        const deg = Math.floor(hash((s % 32)*3 + sec, 7)*3);

      }
      MUS.next += e8; MUS.step++;

  } catch {}
}

    const w = Math.max(1, Math.round(t.w[i]*14)), l = px + Math.round(t.o[i]*14), yy = base - (i+1)*fh;
    g.fillStyle = tier.wall; g.fillRect(l, yy, w, fh);
    g.fillStyle = tier.wallD; g.fillRect(l+w-1, yy, 1, fh); g.fillRect(l, yy+fh-1, w, 1);
    for (let wx = l+1; wx < l+w-1; wx += 3){
      g.fillStyle = tier.win; g.fillRect(wx, yy, 1, fh-1);
      if (hash(wx*7+i, y*31+x) < .55) lights.push([wx, yy, 1, fh-1, 1]);
    }
    topL = l; topW = w;
  }
  const ry = base - t.f*fh;
  if (t.t === 0){
    for (let k=0; k<4; k++){ const w = topW + 2 - k*4; if (w <= 0) break; g.fillStyle = k ? tier.roof : tier.roofL; g.fillRect(topL - 1 + k*2, ry - 1 - k, w, 1); }
    g.fillStyle = tier.roof; g.fillRect(topL-1, ry-1, topW+2, 1);
  } else {
    g.fillStyle = tier.roof; g.fillRect(topL, ry-3, topW, 3);
    g.fillStyle = tier.roofL; g.fillRect(topL, ry-3, topW, 1);
    if (t.t === 2 && t.f >= 20){
      const cx = topL + (topW>>1);
      g.fillStyle = '#9aa0b5'; g.fillRect(cx, ry-9, 1, 6);
      g.fillStyle = Math.floor(now*2) % 2 ? '#ff5a4a' : '#7a2a24'; g.fillRect(cx, ry-10, 1, 1);
    }
  }
  if (e && !e.road && Math.floor(now*2.5) % 2){
    g.fillStyle = '#0b0c16'; g.fillRect(px+4, ry-14, 6, 8);
    g.fillStyle = '#f4b941'; g.fillRect(px+6, ry-13, 2, 4); g.fillRect(px+6, ry-8, 2, 1);
  }
}

/* walkers */
let walkers = [], roadsCache = null;
const SHIRTS = ['#e85d5d','#5d9be8','#f4b941','#b07be0','#5fcf9a','#f08bc0'];
function roads(){ if (!roadsCache){ roadsCache = []; S.grid.forEach((t,i) => { if (t?.k === 'road') roadsCache.push(i); }); } return roadsCache; }
function updWalkers(dt){
  const stay = S.weather === 4 ? .25 : 1;
  const want = Math.min(40, Math.floor(ST.pop/8*stay) + (S.evt?.k === 'tour' && S.evt.done ? 8 : 0)), rs = roads();
  while (walkers.length < want && rs.length){
    const i = rs[Math.floor(Math.random()*rs.length)], x = i%W, y = (i/W)|0;
    walkers.push({ fx:x, fy:y, tx:x, ty:y, lx:x, ly:y, c:SHIRTS[walkers.length % SHIRTS.length], ox:Math.floor(Math.random()*6), oy:Math.floor(Math.random()*5) });
  }
  if (walkers.length > want) walkers.length = want;
  walkers = walkers.filter(w => get(w.tx,w.ty)?.k === 'road');
  for (const w of walkers){
    const dx = w.tx - w.fx, dy = w.ty - w.fy, d = Math.hypot(dx,dy);
    if (d < .02){
      w.fx = w.tx; w.fy = w.ty;
      let opts = N4.map(([a,b]) => [w.tx+a, w.ty+b]).filter(([a,b]) => get(a,b)?.k === 'road');
      if (opts.length > 1) opts = opts.filter(([a,b]) => a !== w.lx || b !== w.ly);
      if (opts.length){ const o = opts[Math.floor(Math.random()*opts.length)]; w.lx = w.tx; w.ly = w.ty; w.tx = o[0]; w.ty = o[1]; }
    } else { const st = Math.min(d, dt*.8); w.fx += dx/d*st; w.fy += dy/d*st; }
  }
}
function drawWalkers(){
  for (const w of walkers){
    const px = Math.round(w.fx*T) + 4 + w.ox, py = M + Math.round(w.fy*T) + 4 + w.oy;
    g.fillStyle = '#f1c9a0'; g.fillRect(px, py, 2, 1);
    g.fillStyle = w.c; g.fillRect(px, py+1, 2, 2);
    g.fillStyle = '#2a2a38'; g.fillRect(px, py+3, 1, 1); g.fillRect(px+1, py+3, 1, Math.floor(now*6)%2);
  }
}

/* rain */
const drops = Array.from({length:160}, () => ({ x:Math.random()*WW, y:Math.random()*WH }));
function drawRain(dt){
  const storm = S.weather === 4;
  g.fillStyle = 'rgba(190,210,255,.55)';
  for (const d of drops){
    d.y += dt*(storm ? 320 : 220); d.x += dt*S.windDir*(storm ? 160 : 30);
    if (d.y > WH){ d.y = -4; d.x = Math.random()*WW; } if (d.x < 0) d.x += WW; if (d.x > WW) d.x -= WW;
    g.fillRect(d.x|0, d.y|0, storm ? 2 : 1, 3);
  }
}

const SOLID = { shop:1, school:1, factory:1, lm:1, bld:1 };
function renderWorld(dt){
  g.drawImage(groundCv, 0, 0); lights = [];
  for (let y=0; y<H; y++) for (let x=0; x<W; x++){
    const t = S.grid[idx(x,y)]; if (!t) continue;
    if (t.k === 'road') drawRoad(x,y);
    else if (t.k === 'park') drawParkGround(x,y);
    else if (t.k === 'school') drawYard(x,y,'#c9bf9d');
    else if (t.k === 'factory') drawYard(x,y,'#8c8678');
  }
  for (let y=0; y<H; y++) for (let x=0; x<W; x++){
    const t = S.grid[idx(x,y)];
    if (t?.k === 'bld'){ const h = t.f*TIERS[t.t].fh; g.fillStyle = 'rgba(10,25,10,.28)'; g.fillRect(x*T+15, M+y*T+4, Math.min(12, 2 + Math.floor(h/6)), 12); }
    else if (t?.k === 'lm'){ g.fillStyle = 'rgba(10,25,10,.28)'; g.fillRect(x*T+15, M+y*T+4, 10, 12); }
  }
  drawWalkers();
  if (hover && inb(hover.x,hover.y)){
    g.fillStyle = toolValid(hover.x, hover.y) ? 'rgba(244,185,65,.3)' : 'rgba(238,106,95,.3)';
    g.fillRect(hover.x*T, M+hover.y*T, T, T);
  }
  for (let y=0; y<H; y++) for (let x=0; x<W; x++){
    const t = S.grid[idx(x,y)]; if (!t) continue;
    const px = x*T, py = M + y*T;
    if (t.k === 'tree'){ drawTree(px+4, py+5, true); if (hash(x,y) < .5) drawTree(px+10, py+7, false); }
    else if (t.k === 'park'){ drawTree(px+3, py+2, true); if (hash(x+9,y) < .6) drawTree(px+3, py+8, false); }
    else if (t.k === 'shop') drawShop(x,y);
    else if (t.k === 'school') drawSchool(x,y);
    else if (t.k === 'factory') drawFactory(x,y);
    else if (t.k === 'lm') drawLandmark(x,y,t.id);
    else if (t.k === 'bld') drawBld(x, y, t, ST.res[idx(x,y)]);
  }
  if (sel && inb(sel.x,sel.y)){
    g.strokeStyle = Math.floor(now*3)%2 ? '#f4b941' : '#fff3c4'; g.lineWidth = 1;
    g.strokeRect(sel.x*T+.5, M+sel.y*T+.5, T-1, T-1);
  }
  let d = dark();
  if (S.weather === 4) d = Math.max(d, .3); else if (WEATHER[S.weather].rain) d = Math.max(d, .12);
  if (d > 0){
    g.fillStyle = `rgba(16,20,58,${d})`; g.fillRect(0,0,WW,WH);
    if (d > .2){
      const a = Math.min(1, (d-.2)/.3);
      for (const [x,y,w,h,s] of lights){ g.fillStyle = `rgba(255,217,102,${a*s})`; g.fillRect(x,y,w,h); }
    }
  }
  if (WEATHER[S.weather].rain) drawRain(dt);
}

/* camera */
let dpr = 1, camTouched = false; const cam = { x:0, y:0, s:2 };
function resize(){
  dpr = window.devicePixelRatio || 1;
  const r = cv.getBoundingClientRect();
  const nw = Math.max(1, Math.round(r.width*dpr)), nh = Math.max(1, Math.round(r.height*dpr));
  if (nw === cv.width && nh === cv.height) return;
  const cx = (cv.width/2 - cam.x)/cam.s, cy = (cv.height/2 - cam.y)/cam.s;
  cv.width = nw; cv.height = nh;
  if (!camTouched) fit(); else { cam.x = nw/2 - cx*cam.s; cam.y = nh/2 - cy*cam.s; clampCam(); }
}
function fit(){
  cam.s = Math.max(1, Math.ceil(Math.min(cv.width/WW, cv.height/(H*T)) - .1));
  cam.x = (cv.width - WW*cam.s)/2; cam.y = (cv.height - H*T*cam.s)/2 - M*cam.s; clampCam();
}
function clampCam(){
  const ww = WW*cam.s, wh = WH*cam.s;
  cam.x = ww <= cv.width ? (cv.width-ww)/2 : Math.min(0, Math.max(cv.width-ww, cam.x));
  cam.y = wh <= cv.height ? (cv.height-wh)/2 : Math.min(0, Math.max(cv.height-wh, cam.y));
}
function zoom(dir, ax = cv.width/2, ay = cv.height/2){
  const ns = Math.min(10, Math.max(1, cam.s + dir)); if (ns === cam.s) return; camTouched = true;
  cam.x = ax - (ax - cam.x)*(ns/cam.s); cam.y = ay - (ay - cam.y)*(ns/cam.s); cam.s = ns; clampCam();
}
new ResizeObserver(resize).observe(cv);
function drawMap(){
  mctx.setTransform(1,0,0,1,0,0);
  mctx.fillStyle = '#151726'; mctx.fillRect(0,0,cv.width,cv.height);
  mctx.imageSmoothingEnabled = false;
  const j = mapShake > 0 ? cam.s*2 : 0;
  const sx = j ? Math.round((Math.random()-.5)*j*2) : 0, sy = j ? Math.round((Math.random()-.5)*j) : 0;
  mctx.drawImage(world, Math.round(cam.x) + sx, Math.round(cam.y) + sy, WW*cam.s, WH*cam.s);
}

/* ---------- tools & input ---------- */
const TOOL_ORDER = ['look','build','road','park','shop','school','factory','landmark','bulldoze'];
let tool = 'look';
function setTool(t){
  tool = t; document.querySelectorAll('.tool').forEach(b => b.classList.toggle('on', b.dataset.tool === t));
  hidePanel();
  if (UNLOCK[t] && ST.pop < UNLOCK[t]) return toast(`${NAMES[t]}在人口達到 ${UNLOCK[t]} 時解鎖`);
  const tips = { build:'點一塊旁邊有道路的空地，開始疊房子', road:'按住拖曳可以連續鋪路', park:'公園讓附近 3 格的住戶更幸福',
    shop:'商店讓附近 4 格的住戶更幸福，也會賺錢', school:'學校讓附近 5 格的住戶幸福 +15', factory:'工廠很會賺錢，但 2 格內的住戶會因為污染不開心',
    landmark:'點一塊空地，選一座地標', bulldoze:'點一下拆掉格子上的東西' };
  if (tips[t]) toast(tips[t]);
}
document.querySelectorAll('.tool').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
function updToolLocks(){
  for (const k in UNLOCK){ const b = document.querySelector(`.tool[data-tool="${k}"]`); const lock = ST.pop < UNLOCK[k];
    b.classList.toggle('locked', lock); b.querySelector('small').textContent = lock ? `人口 ${UNLOCK[k]} 解鎖` : `${COST[k]} 金`; }
}
function toolValid(x,y){
  const t = get(x,y);
  if (COST[tool]) return !t && S.coins >= COST[tool] && !(UNLOCK[tool] && ST.pop < UNLOCK[tool]);
  if (tool === 'build' || tool === 'landmark') return !t || (tool === 'build' && t.k === 'bld');
  if (tool === 'bulldoze') return !!t;
  return true;
}
function tileAt(e){
  const r = cv.getBoundingClientRect();
  const px = (e.clientX - r.left)*dpr, py = (e.clientY - r.top)*dpr;
  const wx = (px - cam.x)/cam.s, wy = (py - cam.y)/cam.s;
  return { x:Math.floor(wx/T), y:Math.floor((wy - M)/T) };
}
let drag = null, lastPaint = -1;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  drag = { x:e.clientX, y:e.clientY, cx:cam.x, cy:cam.y, moved:false, paint: tool === 'road' };
  lastPaint = -1; if (drag.paint) paintRoad(tileAt(e));
});
cv.addEventListener('pointermove', e => {
  const tl = tileAt(e); hover = e.pointerType === 'mouse' ? tl : null;
  if (!drag) return;
  if (drag.paint){ paintRoad(tl); return; }
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.hypot(dx,dy) > 6) drag.moved = true;
  if (drag.moved){ camTouched = true; cam.x = drag.cx + dx*dpr; cam.y = drag.cy + dy*dpr; clampCam(); }
});
cv.addEventListener('pointerup', e => { if (drag && !drag.moved && !drag.paint){ const t = tileAt(e); tapTile(t.x, t.y); } drag = null; });
cv.addEventListener('pointercancel', () => { drag = null; });
cv.addEventListener('pointerleave', () => { hover = null; });
cv.addEventListener('wheel', e => { e.preventDefault(); const r = cv.getBoundingClientRect(); zoom(e.deltaY < 0 ? 1 : -1, (e.clientX-r.left)*dpr, (e.clientY-r.top)*dpr); }, { passive:false });
$('#zin').onclick = () => zoom(1); $('#zout').onclick = () => zoom(-1);

function paintRoad(t){
  if (!inb(t.x,t.y)) return; const i = idx(t.x,t.y); if (i === lastPaint) return; lastPaint = i;
  if (S.grid[i]) return;
  if (S.coins < COST.road){ toast('金幣不足'); return; }
  S.coins -= COST.road; S.grid[i] = { k:'road' }; beep(330,.04); changed();
}
function place(x,y,k){
  if (UNLOCK[k] && ST.pop < UNLOCK[k]) return toast(`${NAMES[k]}在人口達到 ${UNLOCK[k]} 時解鎖`);
  if (get(x,y)) return toast('這格已經有東西了，先用「拆除」清空');
  if (S.coins < COST[k]) return toast('金幣不足');
  S.coins -= COST[k]; S.grid[idx(x,y)] = { k }; beep(520,.08,'triangle'); changed();
  if (k !== 'park' && !roadAdj(x,y)) toast(`${NAMES[k]}要接道路才會運作`);
  else toast(`已蓋好${NAMES[k]}`);
}
function tapTile(x,y){
  if (!inb(x,y)){ hidePanel(); return; }
  const t = get(x,y);
  if (tool === 'look'){ sel = {x,y}; showInfo(x,y); }
  else if (tool === 'build'){
    sel = {x,y};
    if (!t) showPicker(x,y); else if (t.k === 'bld') showInfo(x,y); else toast('這格已經有東西了，先用「拆除」清空');
  }
  else if (tool === 'landmark'){
    sel = {x,y};
    if (!t) showLandmarkPicker(x,y); else if (t.k === 'lm') showInfo(x,y); else toast('這格已經有東西了，先用「拆除」清空');
  }
  else if (COST[tool]) place(x,y,tool);
  else if (tool === 'bulldoze'){
    if (!t) return;
    if (t.k === 'bld' || t.k === 'lm'){ sel = {x,y}; showDemolish(x,y); }
    else { S.grid[idx(x,y)] = null; beep(160,.1); changed(); }
  }
}

}
function showAchs(){
  let h = `<h3>成就 ${ACH.filter(a => S.ach[a.id]).length} / ${ACH.length}</h3>`;
  for (const a of ACH){ const d = S.ach[a.id]; h += `<div class="ach ${d ? 'got' : ''}"><i></i><div><b>${a.n}</b><small>${a.d}${d ? ` · 第 ${d} 天達成` : ''}</small></div></div>`; }
  panel(h);
}
function showLogs(){
  const items = S.log.slice().reverse();
  panel(`<h3>事件紀錄</h3><div class="log">${items.length ? items.map(l => `<p><span>第 ${l.d} 天</span> ${l.m}</p>`).join('') : '<p class="dimtxt">還沒有發生什麼事。</p>'}</div>`);
}
function showHelp(){
  panel(`<h3>怎麼玩</h3>
    <p>1. 用「蓋樓」點道路旁的空地，選房型後進入疊樓。</p>
    <p>2. 樓層會左右移動，點一下放下。超出下層的部分會被切掉，對準就是「完美」，連續 3 次完美樓層會變寬。</p>
    <p>3. 疊越高住越多人，人口會帶來金幣。疊得越整齊，居民越滿意，也越耐震。</p>
    <p>4. 公園、商店、學校讓居民更幸福；工廠很賺錢但有污染；地標吸引觀光客。</p>
    <p>5. 每天天氣不同，偶爾會有地震、颱風、觀光團和市集日。</p>
    <p>6. 跟著左上角的任務走，就能慢慢解鎖公寓、大樓和地標。</p>
    <p class="dimtxt">電腦：滾輪縮放、拖曳移動、方向鍵平移、數字鍵 1–9 切換工具、空白鍵放下樓層。</p>`);
}
info.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act;
  if (a === 'close') return hidePanel();
  if (a === 'help') return showHelp();
  if (a === 'achs') return showAchs();
  if (a === 'logs') return showLogs();
  if (a === 'music'){ setMusic(!prefs.music); return showMenu(); }
  if (a === 'sound'){ prefs.sound = !prefs.sound; savePrefs(); return showMenu(); }
  if (a === 'savenow'){ saveNow(); toast('已存檔'); return; }
  if (a === 'new') return showMenu('new');
  if (a === 'newgo'){ S = newGame(); walkers = []; camTouched = false; changed(); saveNow(); fit(); showHelp(); return; }
  if (!sel) return;
  const { x, y } = sel, t = get(x,y);
  if (a === 'build'){
    const ti = +b.dataset.tier, tier = TIERS[ti];
    if (t || ti > S.unlock) return;
    if (S.coins < tier.cost) return toast('金幣不足');
    S.coins -= tier.cost; hidePanel(); startStack(x, y, ti, null, tier.cost);
  } else if (a === 'lm'){
    const id = +b.dataset.id, L = LANDMARKS[id];
    if (t || ST.lmBuilt[id] || ST.pop < L.unlock) return;
    if (S.coins < L.cost) return toast('金幣不足');
    S.coins -= L.cost; S.grid[idx(x,y)] = { k:'lm', id }; hidePanel(); changed();
    toast(`${L.name}落成！全城居民都很興奮。`); addLog(`${L.name}落成`);
    beep(523,.12,'triangle'); setTimeout(() => beep(659,.12,'triangle'), 120); setTimeout(() => beep(784,.25,'triangle'), 240);
  } else if (a === 'add' && t?.k === 'bld'){
    const c = Math.ceil(TIERS[t.t].cost/2);
    if (S.coins < c) return toast('金幣不足');
    S.coins -= c; hidePanel(); startStack(x, y, t.t, t, c);
  } else if (a === 'demolish' && (t?.k === 'bld' || t?.k === 'lm')){
    S.grid[idx(x,y)] = null; beep(140,.2,'sawtooth'); hidePanel(); changed();
  }
});
$('#menuBtn').onclick = () => showMenu();

/* ---------- stacking mini-game ---------- */
const sc = $('#sc'), sctx = sc.getContext('2d');
const SW = 160, SH = 240, BASEW = 64, BASEL = (SW - BASEW)/2, GROUND = SH - 24;
let SM = null;
function startStack(x, y, ti, existing, paid){
  const floors = existing ? existing.w.map((w,i) => ({ l: BASEL + existing.o[i]*BASEW, w: w*BASEW })) : [];
  SM = { x, y, t:ti, floors, start:floors.length, cur:null, combo:0, maxCombo:0, debris:[], over:false, earned:0, camY:0, paid, shake:0 };
  SM.camY = camTarget();
  $('#sres').hidden = true; $('#sfinish').hidden = false; $('#stack').hidden = false;
  spawn(); updHead(); beep(440,.06);
}
const topF = () => SM.floors.length ? SM.floors[SM.floors.length-1] : { l:BASEL, w:BASEW };
function camTarget(){ const bh = TIERS[SM.t].bh; return Math.max(0, (SM.floors.length + 3)*bh - (GROUND - 30)); }
function spawn(){
  const t = topF(), n = SM.floors.length, tier = TIERS[SM.t];
  const sp = Math.min(175, tier.speed + n*3.2), left = n % 2 === 0;
  SM.cur = { l: left ? 0 : SW - t.w, w: t.w, v: left ? sp : -sp };
}
function updHead(){
  const tier = TIERS[SM.t], n = SM.floors.length;
  const wind = S.wind ? `${S.windDir > 0 ? '→' : '←'} ${S.wind >= .7 ? '狂' : S.wind >= .4 ? '強' : '弱'}` : '無';
  $('#shead').innerHTML = `<span><span class="k">${tier.name}</span> <b>${n}</b> / ${tier.max} 層</span><span><span class="k">連擊</span> ${SM.combo}</span><span><span class="k">風</span> ${wind}</span><span><span class="k">天氣</span> ${WEATHER[S.weather].n}</span>`;
}
function flash(msg){ const f = $('#sflash'); f.textContent = msg; f.classList.add('show'); requestAnimationFrame(() => requestAnimationFrame(() => f.classList.remove('show'))); }
function drop(){
  if (!SM || SM.over || !SM.cur) return;
  const c = SM.cur, t = topF(), tier = TIERS[SM.t], bh = tier.bh, yy = GROUND - (SM.floors.length+1)*bh;
  const tol = WEATHER[S.weather].rain ? 1.2 : 2.5;
  if (Math.abs(c.l - t.l) <= tol){
    SM.combo++; SM.maxCombo = Math.max(SM.maxCombo, SM.combo); S.coins += 2; SM.earned += 2;
    let w = t.w, l = t.l;
    if (SM.combo >= 3 && w < BASEW){ const gw = Math.min(4, BASEW - w); w += gw; l -= gw/2; flash('完美！樓層變寬'); }
    else flash(SM.combo > 1 ? `完美 ×${SM.combo}` : '完美！');
    SM.floors.push({ l, w }); beep(520 + Math.min(SM.combo,12)*60, .1, 'triangle');
  } else {
    SM.combo = 0;
    const L = Math.max(c.l, t.l), R = Math.min(c.l + c.w, t.l + t.w), ow = R - L;
    if (ow < 1){
      SM.debris.push({ l:c.l, w:c.w, y:yy, vy:0 }); SM.cur = null; SM.shake = .4;
      beep(110,.35,'sawtooth',.05); endStack('collapse'); return;
    }
    if (c.l < L) SM.debris.push({ l:c.l, w:L - c.l, y:yy, vy:0 });
    if (c.l + c.w > R) SM.debris.push({ l:R, w:c.l + c.w - R, y:yy, vy:0 });
    SM.floors.push({ l:L, w:ow }); beep(300,.06);
  }
  SM.cur = null; updHead();
  if (SM.floors.length >= tier.max) endStack('max'); else spawn();
}
function endStack(reason){
  if (!SM || SM.over) return;
  SM.over = true; SM.cur = null;
  const tier = TIERS[SM.t], n = SM.floors.length, added = n - SM.start, i = idx(SM.x, SM.y);
  S.st.maxCombo = Math.max(S.st.maxCombo || 0, SM.maxCombo);
  let msg;
  if (added <= 0){
    S.coins += SM.paid;
    msg = `<h3>${reason === 'collapse' ? '沒疊上去' : '沒有新樓層'}</h3><p>這次沒有蓋出樓層，已退回 ${SM.paid} 金。</p>`;
  } else {
    if (dark() > .3) S.st.night = 1;
    if (S.weather >= 3 && added >= 10) S.st.storm = 1;
    const r2 = v => Math.round(v*100)/100;
    const ws = SM.floors.map(f => r2(f.w/BASEW)), os = SM.floors.map(f => r2((f.l - BASEL)/BASEW));
    const p = r2(ws.reduce((a,b) => a+b, 0)/ws.length);
    S.grid[i] = { k:'bld', t:SM.t, f:n, w:ws, o:os, p };
    const head = reason === 'collapse' ? '樓層掉下去了！' : reason === 'max' ? '蓋到頂了！' : '完工！';
    msg = `<h3>${head}</h3><p>${tier.name}現在有 <b>${n}</b> 層（這次 +${added}）</p><p>可住 ${n*tier.pop} 人 · 精準度 ${Math.round(p*100)}%</p>${SM.earned ? `<p>完美獎勵 +${SM.earned} 金</p>` : ''}${p < .65 ? '<p class="no">精準度偏低，地震時容易倒樓。</p>' : ''}${roadAdj(SM.x,SM.y) ? '' : '<p class="no">記得幫它接上道路，居民才會搬進來。</p>'}`;
    beep(660,.12,'triangle'); setTimeout(() => beep(880,.18,'triangle'), 120);
  }
  changed(); saveNow();
  const r = $('#sres'); r.innerHTML = msg + '<button type="button" id="sback">回到城市</button>'; r.hidden = false;
  $('#sfinish').hidden = true;
  setTimeout(() => $('#sback')?.focus(), 50);
}
function closeStack(){ if (!SM) return; sel = { x:SM.x, y:SM.y }; SM = null; $('#stack').hidden = true; showInfo(sel.x, sel.y); }
$('#sres').addEventListener('click', e => { if (e.target.id === 'sback') closeStack(); });
$('#sfinish').onclick = () => endStack('finish');
sc.addEventListener('pointerdown', e => { e.preventDefault(); drop(); });

function mix(a, b, t){
  const pa = parseInt(a.slice(1),16), pb = parseInt(b.slice(1),16);
  const ch = s => Math.round(((pa>>s)&255)*(1-t) + ((pb>>s)&255)*t);
  return '#' + [16,8,0].map(s => ch(s).toString(16).padStart(2,'0')).join('');
}
function sBlock(l, y, w, h, tier, i, lit){
  const c = sctx; l = Math.round(l); w = Math.max(1, Math.round(w)); y = Math.round(y);
  c.fillStyle = tier.wall; c.fillRect(l, y, w, h);
  c.fillStyle = tier.wallD; c.fillRect(l + w - 2, y, 2, h); c.fillRect(l, y + h - 2, w, 2);
  const wh = h >= 11 ? h - 7 : h - 5, wy = h >= 11 ? y + 3 : y + 2;
  for (let wx = l + 3; wx + 3 <= l + w - 3; wx += 7){
    c.fillStyle = lit && hash(wx*3 + i, i*7) < .6 ? '#ffd966' : tier.win;
    c.fillRect(wx, wy, 3, Math.max(1, wh));
  }
}
function updStack(dt){
  if (!SM) return;
  const c = SM.cur;
  if (c){
    const mult = 1 + S.wind*S.windDir*Math.sign(c.v);
    c.l += c.v*mult*dt;
    if (c.l < 0){ c.l = 0; c.v = Math.abs(c.v); }
    if (c.l > SW - c.w){ c.l = SW - c.w; c.v = -Math.abs(c.v); }
  }
  for (const d of SM.debris){ d.vy += 500*dt; d.y += d.vy*dt; }
  SM.debris = SM.debris.filter(d => d.y < GROUND + 200);
  SM.camY += (camTarget() - SM.camY)*Math.min(1, dt*6);
  SM.shake = Math.max(0, SM.shake - dt);
}
function renderStack(){
  if (!SM) return;
  const c = sctx, tier = TIERS[SM.t], bh = tier.bh, cy = Math.round(SM.camY);
  let d = dark(); if (S.weather === 4) d = Math.max(d, .35);
  const sx = SM.shake ? Math.round((Math.random()-.5)*4) : 0;
  c.setTransform(1,0,0,1,sx,0);
  const bands = 8;
  for (let i=0; i<bands; i++){
    c.fillStyle = mix(mix('#7fc4e6', '#cfeaf5', i/bands), mix('#141a3c', '#3a3566', i/bands), Math.min(1, d/.62));
    c.fillRect(-4, Math.floor(i*SH/bands), SW+8, Math.ceil(SH/bands)+1);
  }
  if (d > .3){ c.fillStyle = '#fff6d0'; for (let i=0; i<24; i++) c.fillRect(Math.floor(hash(i,40)*SW), Math.floor(hash(i,41)*SH*.6), 1, 1); }
  const cloudX = (now*8*S.windDir*(1 + S.wind*4)) % (SW + 60);
  c.fillStyle = d > .3 ? 'rgba(200,200,230,.25)' : 'rgba(255,255,255,.85)';
  for (let k=0; k<3; k++){ const x = ((k*70 + cloudX) % (SW+60) + SW + 60) % (SW+60) - 40, y = 20 + k*38 + Math.round(cy*.15); c.fillRect(x, y, 26, 5); c.fillRect(x+5, y-3, 14, 3); }
  const par = Math.round(cy*.35);
  for (let i=0; i<13; i++){
    const h = 18 + Math.floor(hash(i,9)*46), x = i*13 - 4;
    c.fillStyle = d > .3 ? '#262c52' : '#9fb8c9'; c.fillRect(x, GROUND - h + par, 12, h + 30);
    if (d > .3){ c.fillStyle = '#e3c76a'; for (let k=0; k<3; k++) if (hash(i,k+20) < .5) c.fillRect(x + 3 + k*3, GROUND - h + par + 4 + k*5, 1, 1); }
  }
  c.fillStyle = '#5b9b4b'; c.fillRect(-4, GROUND + cy, SW+8, SH);
  c.fillStyle = '#4e8a40'; c.fillRect(-4, GROUND + cy, SW+8, 2);
  c.fillStyle = '#7a776f'; c.fillRect(BASEL - 3, GROUND + cy, BASEW + 6, 4);
  const lit = d > .25;
  SM.floors.forEach((f,i) => sBlock(f.l, GROUND - (i+1)*bh + cy, f.w, bh, tier, i, lit));
  if (SM.cur){
    const t = topF(), yy = GROUND - (SM.floors.length+1)*bh + cy;
    c.fillStyle = 'rgba(255,255,255,.18)';
    c.fillRect(Math.round(t.l), yy - 30, 1, 30 + bh); c.fillRect(Math.round(t.l + t.w) - 1, yy - 30, 1, 30 + bh);
    sBlock(SM.cur.l, yy, SM.cur.w, bh, tier, SM.floors.length, lit);
  }
  for (const db of SM.debris) sBlock(db.l, db.y + cy, db.w, bh, tier, 0, false);
  if (WEATHER[S.weather].rain){
    c.fillStyle = 'rgba(200,215,255,.6)';
    for (let i=0; i<(S.weather === 4 ? 70 : 40); i++){ const x = (hash(i,3)*SW + now*(S.weather === 4 ? 120 : 30)*S.windDir) % SW, y = (hash(i,5)*SH + now*180) % SH; c.fillRect((x+SW)%SW|0, y|0, 1, 4); }
  }
  if (S.wind >= .4){
    c.fillStyle = 'rgba(255,255,255,.5)';
    for (let i=0; i<6; i++){ const y = 30 + i*28, x = ((hash(i,8)*SW + now*90*S.windDir*(S.wind/.5)) % (SW+30) + SW + 30) % (SW+30) - 20; c.fillRect(x|0, y, 14, 1); }
  }
  c.setTransform(1,0,0,1,0,0);
}

/* ---------- HUD ---------- */
const EVT_LABEL = { typhoon:'颱風警報', market:'市集日', tour:'觀光團', quake:'' };
function hud(){
  $('#coins').textContent = Math.floor(S.coins);
  $('#inc').textContent = `+${ST.inc.toFixed(1)}/時`;
  $('#pop').textContent = ST.pop;
  $('#hap').textContent = ST.pop ? ST.happy + '%' : '—';
  const m = Math.floor(S.min % 1440);
  $('#clock').textContent = `第 ${dayNo()} 天 ${pad((m/60)|0)}:${pad(m%60)}`;
  $('#wx').textContent = WEATHER[S.weather].n + (S.wind ? (S.windDir > 0 ? ' →' : ' ←') : '');
  const ev = S.evt && (S.evt.k === 'market' || S.evt.k === 'typhoon' || (S.evt.k === 'tour' && S.evt.done)) ? EVT_LABEL[S.evt.k] : '';
  $('#evt').textContent = ev ? `· ${ev}` : '';
  updToolLocks(); checkGoals();
}

/* ---------- keyboard ---------- */
addEventListener('keydown', e => {
  if (SM){
    if (!SM.over && (e.code === 'Space' || e.code === 'Enter')){ e.preventDefault(); drop(); }
    else if (e.key === 'Escape'){ SM.over ? closeStack() : endStack('finish'); }
    return;
  }
  if (e.target.closest && e.target.closest('button') && (e.code === 'Space' || e.code === 'Enter')) return;
  const step = 48*dpr, k = e.key;
  if (k === 'ArrowLeft' || k === 'a'){ camTouched = true; cam.x += step; clampCam(); }
  else if (k === 'ArrowRight' || k === 'd'){ camTouched = true; cam.x -= step; clampCam(); }
  else if (k === 'ArrowUp' || k === 'w'){ camTouched = true; cam.y += step; clampCam(); }
  else if (k === 'ArrowDown' || k === 's'){ camTouched = true; cam.y -= step; clampCam(); }
  else if (k === '+' || k === '='){ zoom(1); }
  else if (k === '-'){ zoom(-1); }
  else if (k === 'Escape'){ hidePanel(); }
  else if (k.length === 1 && k >= '1' && k <= '9'){ setTool(TOOL_ORDER[+k-1]); }
});

/* ---------- loop & boot ---------- */
let last = performance.now(), hudAcc = 0;
function frame(ts){
  const dt = Math.min(.05, (ts - last)/1000); last = ts; now = ts/1000;
  tick(dt); updWalkers(dt); updStack(dt);
  mapShake = Math.max(0, mapShake - dt);
  renderWorld(dt); drawMap(); renderStack();
  hudAcc += dt; if (hudAcc > .2){ hudAcc = 0; hud(); }
  requestAnimationFrame(frame);
}
function start(data){
  S = sanitize(data && data.S) || sanitize(loadLocal()) || newGame();
  const fresh = !S.savedAt && !S.grid.some(t => t?.k === 'bld');
  $('#musicBtn').textContent = `音樂 ${prefs.music ? '開' : '關'}`;
  compute(); resize(); hud();
  if (S.savedAt){ const d = new Date(S.savedAt); $('#saved').textContent = `已存檔（本機）${pad(d.getHours())}:${pad(d.getMinutes())}`; }
  if (fresh) showHelp();
  requestAnimationFrame(t => { last = t; frame(t); });
  connectCloud();
}
try { window.claude?.hot?.snapshot?.(() => ({ S })); } catch {}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
