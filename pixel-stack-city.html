<title>像素疊城</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap">
<style>
/* Layout: one-screen game. HUD strip on top, pixel city map in the middle (quest card top-left, panels top-right), tool tray at the bottom; stacking opens as an overlay. Single dark "night console" theme by choice. */
:root{
  --bg:#151726; --panel:#222538; --panel2:#2d3150; --edge:#0b0c16;
  --ink:#efe6cf; --dim:#9d9bb0; --gold:#f4b941; --good:#86d17a; --bad:#ee6a5f; --sky:#7fc4e6;
  --pix:"DotGothic16","Noto Sans TC","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--pix);font-size:15px;overflow:hidden;-webkit-tap-highlight-color:transparent}
#app{height:100%;display:flex;flex-direction:column}
#hud{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding-block:8px;padding-inline:16px;background:var(--panel);box-shadow:0 3px 0 var(--edge);z-index:2}
.stat{display:flex;gap:6px;align-items:baseline;white-space:nowrap;font-variant-numeric:tabular-nums}
.stat .k{color:var(--dim);font-size:13px;letter-spacing:.05em}
.stat b{font-weight:400;color:var(--ink)}
#coins{color:var(--gold)}
#inc{color:var(--good);font-size:13px}
#evt{color:var(--gold);font-size:13px}
#lvl{color:var(--sky)}
.spacer{flex:1}
#saved{font-size:12px;color:var(--dim)}
#view{position:relative;flex:1;min-height:0}
#map{width:100%;height:100%;display:block;image-rendering:pixelated;touch-action:none;cursor:crosshair}
#tools{display:flex;gap:8px;padding-block:10px;padding-inline:16px;overflow-x:auto;background:var(--panel);box-shadow:0 -3px 0 var(--edge);z-index:2}
button{font:inherit;color:var(--ink);background:var(--panel2);border:0;padding:8px 12px;cursor:pointer;
  box-shadow:inset -3px -3px 0 rgba(0,0,0,.4),inset 3px 3px 0 rgba(255,255,255,.1),0 0 0 2px var(--edge)}
button:hover{filter:brightness(1.15)}
button:active{box-shadow:inset 3px 3px 0 rgba(0,0,0,.4),0 0 0 2px var(--edge)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
button:disabled{opacity:.45;cursor:not-allowed;filter:none}
.tool{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:58px;flex:0 0 auto}
.tool small{font-size:11px;color:var(--dim)}
.tool.on{background:var(--gold);color:#2a1d05}
.tool.on small{color:#5a3f0a}
.tool.locked{opacity:.55}
.zoom{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px}
.zoom button{width:40px;height:40px;padding:0;font-size:20px}
.zoom #xray{font-size:16px}
.zoom #xray.on{background:var(--gold);color:#2a1d05}
#quest{position:absolute;left:16px;top:16px;max-width:min(330px,calc(100% - 32px));display:flex;flex-direction:column;gap:8px;z-index:2}
.qc{background:rgba(11,12,22,.88);padding:8px 12px;box-shadow:0 0 0 2px var(--panel2);display:flex;flex-direction:column;gap:2px;line-height:1.4}
.qc .k{color:var(--dim);font-size:12px;letter-spacing:.05em}
.qc .rw{color:var(--gold);font-size:13px}
.qc.done{box-shadow:0 0 0 2px var(--gold)}
.qc.req{box-shadow:0 0 0 2px var(--sky)}
.qc button{align-self:flex-start;margin-top:4px;padding:4px 10px;font-size:13px}
.panel{position:absolute;right:16px;top:16px;width:min(330px,calc(100% - 32px));max-height:calc(100% - 32px);overflow:auto;background:var(--panel);padding:14px 16px;
  box-shadow:0 0 0 3px var(--edge),6px 6px 0 rgba(0,0,0,.45);display:flex;flex-direction:column;gap:8px;z-index:3}
.panel h3{margin:0;font-weight:400;font-size:18px;color:var(--gold)}
.panel p{margin:0;line-height:1.55}
.panel .row{display:flex;justify-content:space-between;gap:8px;font-variant-numeric:tabular-nums}
.ok{color:var(--good)} .no{color:var(--bad)} .dimtxt{color:var(--dim);font-size:13px}
.pick{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left}
.pick small{color:var(--dim);font-size:12px}
.btnrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:4px}
#cityBtn{color:var(--gold);max-width:12em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.panel input[type=text]{font:inherit;color:var(--ink);background:var(--edge);border:2px solid var(--panel2);padding:6px 8px;width:100%}
.panel input[type=text]:focus-visible{outline:2px solid var(--gold);outline-offset:1px}
.cityrow{display:flex;justify-content:space-between;align-items:center;gap:8px;padding-block:6px;border-bottom:1px solid var(--panel2)}
.cityrow div{display:flex;flex-direction:column;min-width:0}
.cityrow small{color:var(--dim);font-size:12px}
.cityrow.cur b{color:var(--gold)}
.cityrow b{font-weight:400}
.cityrow .btnrow{margin:0;flex-wrap:nowrap}
.cityrow button{padding:4px 8px;font-size:13px}
.stars{color:var(--gold);letter-spacing:1px}
.omikuji{align-self:center;display:flex;gap:10px;align-items:stretch;background:#f4efe2;color:#3a2a20;padding:14px 12px;box-shadow:0 0 0 3px #c8442f,4px 4px 0 rgba(0,0,0,.4);animation:kuji .5s ease-out}
.omikuji b{writing-mode:vertical-rl;font-weight:400;font-size:34px;color:#c8442f;letter-spacing:6px}
.omikuji span{writing-mode:vertical-rl;font-size:14px;line-height:1.6;max-height:12em}
@keyframes kuji{0%{transform:translateY(-30px) rotate(-6deg);opacity:0}100%{transform:none;opacity:1}}
.gres{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:8px}
.gres div{background:var(--edge);padding:8px;display:flex;flex-direction:column;gap:2px;box-shadow:0 0 0 2px var(--rc);animation:kuji .4s ease-out backwards;animation-delay:var(--d)}
.gres b{font-weight:400;color:var(--rc);font-size:12px}
.gres small{font-size:12px;color:var(--ink)}
.gres em{font-style:normal;color:var(--good);font-size:11px}
@media (prefers-reduced-motion:reduce){.omikuji,.gres div{animation:none}}
.prog{height:6px;background:var(--edge);box-shadow:0 0 0 1px var(--panel2)}
.prog i{display:block;height:100%;background:var(--good)}
.ach{display:flex;gap:10px;align-items:flex-start;padding-block:4px}
.ach i{flex:0 0 14px;height:14px;margin-top:3px;background:var(--panel2);box-shadow:0 0 0 2px var(--edge)}
.ach.got i{background:var(--gold)}
.ach div{display:flex;flex-direction:column;min-width:0}
.ach small{color:var(--dim);font-size:12px}
.ach:not(.got) b{color:var(--dim)}
.ach b{font-weight:400}
.log{display:flex;flex-direction:column;gap:6px}
.log p{font-size:13px}
.log span{color:var(--dim)}
#toast{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);max-width:calc(100% - 96px);background:var(--edge);color:var(--ink);padding:8px 14px;
  box-shadow:0 0 0 2px var(--gold);pointer-events:none;opacity:0;transition:opacity .25s;text-align:center;line-height:1.4;z-index:4}
#toast.show{opacity:1}
#toast.alert{box-shadow:0 0 0 2px var(--bad)}
#banner{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);background:var(--edge);padding:16px 28px;box-shadow:0 0 0 3px var(--gold),8px 8px 0 rgba(0,0,0,.5);
  text-align:center;z-index:5;pointer-events:none;display:flex;flex-direction:column;gap:4px;max-width:calc(100% - 32px)}
#banner b{font-weight:400;font-size:26px;color:var(--gold)}
#banner span{color:var(--ink);line-height:1.5}
#stack{position:fixed;inset:0;background:rgba(8,9,18,.8);display:flex;align-items:center;justify-content:center;padding-inline:16px;z-index:10}
.sbox{background:var(--panel);padding:14px;box-shadow:0 0 0 3px var(--edge),8px 8px 0 rgba(0,0,0,.5);display:flex;flex-direction:column;gap:10px;align-items:center;max-width:100%}
#shead{display:flex;flex-wrap:wrap;gap:4px 14px;justify-content:center;font-variant-numeric:tabular-nums}
#shead .k{color:var(--dim);font-size:13px}
.swrap{position:relative}
#sc{display:block;height:min(62vh,480px);aspect-ratio:2/3;max-width:calc(100vw - 60px);image-rendering:pixelated;touch-action:none;cursor:pointer;box-shadow:0 0 0 2px var(--edge)}
#sflash{position:absolute;left:0;right:0;top:18%;text-align:center;font-size:22px;color:var(--gold);text-shadow:2px 2px 0 var(--edge);opacity:0;transition:opacity .5s,transform .5s;pointer-events:none}
#sflash.show{opacity:1;transform:translateY(-8px);transition:none}
#sres{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(11,12,22,.84);text-align:center;padding:16px;overflow:auto}
#sres h3{margin:0;font-weight:400;color:var(--gold);font-size:22px}
#sres p{margin:0;line-height:1.6}
#sres .btnrow{justify-content:center}
#sres .share{font-size:13px;color:var(--dim);user-select:all;background:var(--edge);padding:6px 8px;max-width:100%;overflow-wrap:anywhere}
.shint{margin:0;color:var(--dim);font-size:13px;text-align:center;max-width:320px}
#rate{position:fixed;inset:0;background:rgba(8,9,18,.82);display:flex;align-items:center;justify-content:center;padding-inline:16px;z-index:11}
.rbox{background:var(--panel);padding:18px 20px;box-shadow:0 0 0 3px var(--gold),8px 8px 0 rgba(0,0,0,.5);display:flex;flex-direction:column;gap:10px;width:min(420px,100%);max-height:calc(100% - 32px);overflow:auto}
.rbox h3{margin:0;font-weight:400;color:var(--gold);font-size:22px;text-align:center;text-wrap:balance}
.rbox .sub{color:var(--dim);text-align:center;font-size:13px}
.rrow{display:grid;grid-template-columns:5.5em auto 1fr;gap:4px 10px;align-items:baseline}
.rrow small{color:var(--dim);font-size:12px;grid-column:3}
.rstars{color:var(--gold);letter-spacing:2px;white-space:nowrap}
.rstars i{font-style:normal;opacity:0;display:inline-block;animation:starpop .35s forwards;animation-delay:var(--d)}
.rstars i.off{color:var(--panel2)}
.rtotal{text-align:center;font-size:30px}
.rtotal .rstars{letter-spacing:6px}
@keyframes starpop{0%{opacity:0;transform:scale(2.2)}100%{opacity:1;transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.rstars i{animation:none;opacity:1}}
@media (prefers-reduced-motion:reduce){#toast,#sflash{transition:none}}
</style>

<div id="app">
  <header id="hud">
    <button id="cityBtn" type="button" aria-label="城市列表">城市</button>
    <div class="stat"><span class="k">金幣</span><b id="coins">0</b><span id="inc"></span></div>
    <div class="stat"><span class="k">人口</span><b id="pop">0</b><span class="k" id="tpop"></span></div>
    <div class="stat"><span class="k">幸福</span><b id="hap">—</b></div>
    <div class="stat"><span class="k">交通</span><b id="trf">順暢</b></div>
    <div class="stat"><b id="lvl">村莊</b></div>
    <div class="stat"><b id="clock">春 · 第 1 天 07:00</b></div>
    <div class="stat"><span class="k">天氣</span><b id="wx">晴天</b><span id="evt"></span></div>
    <div class="spacer"></div>
    <span id="saved">尚未存檔</span>
    <button id="chBtn" type="button">每日挑戰</button>
    <button id="musicBtn" type="button" aria-label="音樂開關">音樂 開</button>
    <button id="menuBtn" type="button">選單</button>
  </header>
  <main id="view">
    <canvas id="map" aria-label="城市地圖"></canvas>
    <div id="quest" aria-live="polite"></div>
    <div class="zoom"><button id="xray" type="button" aria-label="透視模式" aria-pressed="false" title="透視模式：讓高樓變透明，看得到後面的房子">透</button><button id="zin" type="button" aria-label="放大">+</button><button id="zout" type="button" aria-label="縮小">−</button></div>
    <div id="info" class="panel" hidden></div>
    <div id="banner" hidden></div>
    <div id="toast" role="status"></div>
  </main>
  <nav id="tools">
    <button class="tool on" data-tool="look" type="button">查看<small>點選格子</small></button>
    <button class="tool" data-tool="build" type="button">蓋樓<small>疊疊樂</small></button>
    <button class="tool" data-tool="road" type="button">道路<small>5 金/格</small></button>
    <button class="tool" data-tool="park" type="button">公園<small>30 金</small></button>
    <button class="tool" data-tool="shop" type="button">商店<small>60 金</small></button>
    <button class="tool" data-tool="school" type="button">學校<small>120 金</small></button>
    <button class="tool" data-tool="factory" type="button">工廠<small>150 金</small></button>
    <button class="tool" data-tool="big" type="button">大型<small>2×2</small></button>
    <button class="tool" data-tool="landmark" type="button">地標<small>獨一無二</small></button>
    <button class="tool" data-tool="jp" type="button">和風<small>神社・鳥居</small></button>
    <button class="tool" data-tool="fun" type="button">娛樂<small>彩券・電玩</small></button>
    <button class="tool" data-tool="def" type="button">防衛<small>防衛塔・軍隊</small></button>
    <button class="tool" data-tool="land" type="button">買地<small>擴張</small></button>
    <button class="tool" data-tool="bulldoze" type="button">拆除<small>免費</small></button>
  </nav>
</div>

<div id="stack" hidden>
  <div class="sbox">
    <div id="shead"></div>
    <div class="swrap">
      <canvas id="sc" width="160" height="240" aria-label="疊樓畫面"></canvas>
      <div id="sflash"></div>
      <div id="sres" hidden></div>
    </div>
    <div class="btnrow"><button id="sfinish" type="button">完工</button></div>
    <p class="shint" id="shint">點畫面或按空白鍵放下樓層。對齊下面那層就是「完美」。</p>
  </div>
</div>

<div id="rate" hidden><div class="rbox" role="dialog" aria-labelledby="rateTitle"><div id="rateBody"></div><div class="btnrow" style="justify-content:center"><button type="button" id="rateClose">太好了</button></div></div></div>

    const depth = Math.max(3, Math.round(H*.22));

      for (let y=H-d; y<H; y++) setW(x,y);

    }

  }
}

    { n:'建築品質', s:band(prec, [.6,.7,.8,.9]), c:`平均疊樓精準度 ${Math.round(prec*100)}%` },
    { n:'多樣性', s:band(kinds.size, [3,5,8,11]), c:`${kinds.size} 種建築與設施` },
    { n:'韌性', s:clamp(band(y.lost, [30,15,5,0], false) + (y.def ? 1 : 0) - (y.inv > y.def ? 1 : 0), 1, 5),
      c:(y.lost ? `天災和入侵共損失 ${y.lost} 層` : '這一年沒有任何損失') + (y.inv ? ` · 擋下 ${y.def}/${y.inv} 次入侵` : '') },

function starsHtml(n, d0){
  let h = '';
  for (let i=0; i<5; i++){ const full = i < Math.floor(n), half = !full && i < n; h += `<i class="${full || half ? '' : 'off'}" style="--d:${(d0 + i*.12).toFixed(2)}s">${half ? '☆' : '★'}</i>`; }
  return h;
}

  S.ratings.push({ y, d:dayNo(), stars:r.stars, parts:r.parts.map(p => p.s) }); if (S.ratings.length > 12) S.ratings.shift();
  G.st.bestStars = Math.max(G.st.bestStars || 0, r.stars);
  addLog(`第 ${y} 年城市評鑑：${r.stars} 顆星`);

  }

}

let dbBase = null, saving = false, saveWhere = '本機', saveTimer = 0, dirty = false, lastSavedCoins = -1;
const dirtyCities = new Set();
function markDirty(){ dirty = true; if (S) dirtyCities.add(S.id); }
function scheduleSave(){ clearTimeout(saveTimer); saveTimer = setTimeout(saveNow, 2500); }
function snapshotCity(){ S.popCache = ST.pop; S.incCache = ST.inc; S.happyCache = ST.happy; }
async function saveNow(){
  if (saving){ scheduleSave(); return; }
  snapshotCity();
  G.savedAt = Date.now(); dirty = false; lastSavedCoins = Math.floor(S.coins);
  dirtyCities.add(S.id);
  try { localStorage.setItem(LS, JSON.stringify(G)); } catch {}
  if (dbBase){
    saving = true;
    try {
      const ids = [...dirtyCities]; dirtyCities.clear();
      for (const id of ids){ const c = G.cities.find(q => q.id === id); if (c) await dbBase.doc('city' + id).set({ json:JSON.stringify(c), savedAt:G.savedAt }); }
      await dbBase.doc('meta').set({ json:JSON.stringify({ ...G, cities:G.cities.map(c => ({ id:c.id })) }), savedAt:G.savedAt });
      saveWhere = '雲端';
    } catch { saveWhere = '本機'; }
    saving = false;
  }
  const d = new Date(G.savedAt);
  $('#saved').textContent = `已存檔（${saveWhere}）${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
function loadLocal(){ try { const s = localStorage.getItem(LS); return s ? JSON.parse(s) : null; } catch { return null; } }
setInterval(() => { if (dirty || Math.floor(S.coins) !== lastSavedCoins) saveNow(); }, 120000);

async function connectCloud(){
  try {
    if (!window.claude?.use) return;
    const [db, user] = await Promise.all([claude.use('db'), claude.use('user')]);
    if (!db || !user) return;
    const id = await user.id(); if (!id) return;
    dbBase = { doc: name => db.doc('data/users/' + id + '/v2_' + name) };
    const meta = await dbBase.doc('meta').get();
    if (meta.exists && (meta.data().savedAt || 0) > (G.savedAt || 0)){
      const m = JSON.parse(meta.data().json), cities = [];
      for (const c of m.cities){ const snap = await dbBase.doc('city' + c.id).get(); if (!snap.exists) { cities.length = 0; break; } cities.push(JSON.parse(snap.data().json)); }
      const g2 = cities.length ? loadGlobal({ ...m, cities }) : null;
      if (g2 && !SM){ G = g2; enterCity(G.cur); resetWorld(); toast('已載入雲端存檔'); }
    }
    saveWhere = '雲端';
    G.cities.forEach(c => dirtyCities.add(c.id));
    if (G.savedAt) saveNow();
  } catch { dbBase = null; }
}

let AC = null, master = null;
const prefs = (() => { try { return Object.assign({ music:true, sound:true }, JSON.parse(localStorage.getItem(PREFS) || '{}')); } catch { return { music:true, sound:true }; } })();
function savePrefs(){ try { localStorage.setItem(PREFS, JSON.stringify(prefs)); } catch {} }
function audio(){
  try {
    if (!AC){ AC = new (window.AudioContext || window.webkitAudioContext)(); master = AC.createGain(); master.gain.value = prefs.music ? .5 : 0; master.connect(AC.destination); }
    if (AC.state === 'suspended') AC.resume();
  } catch { AC = null; }
  return AC;
}
function beep(f, d=.08, type='square', vol=.04){
  if (!prefs.sound || !audio()) return;
  try {
    const o = AC.createOscillator(), gn = AC.createGain();
    o.type = type; o.frequency.value = f; gn.gain.value = vol;
    gn.gain.exponentialRampToValueAtTime(.0001, AC.currentTime + d);
    o.connect(gn).connect(AC.destination); o.start(); o.stop(AC.currentTime + d);
  } catch {}
}
function note(t, m, d, type, vol){
  const o = AC.createOscillator(), gn = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(440*Math.pow(2,(m-69)/12), t);
  gn.gain.setValueAtTime(0, t); gn.gain.linearRampToValueAtTime(vol, t + .012); gn.gain.exponentialRampToValueAtTime(.0001, t + d);
  o.connect(gn).connect(master); o.start(t); o.stop(t + d + .02);
}

function grandRuns(){

  while (list.length < want && rs.length){ const i = rs[Math.floor(Math.random()*rs.length)], x = i%W, y = (i/W)|0; list.push(Object.assign({ fx:x, fy:y, tx:x, ty:y, lx:x, ly:y, dx:1, dy:0 }, mk(list.length))); }
  if (list.length > want) list.length = want;
  return list.filter(w => get(w.tx,w.ty)?.k === 'road');
}
function updMovers(dt){
  const stay = S.weather === 4 ? .25 : S.weather === 5 ? .6 : 1;
  const wantW = Math.min(40, Math.floor(ST.pop/8*stay) + (S.evt?.k === 'tour' && S.evt.done ? 8 : 0) + (festival() ? 10 : 0));
  walkers = spawnMover(walkers, wantW, n => ({ c:SHIRTS[n % SHIRTS.length], ox:Math.floor(Math.random()*8), oy:Math.floor(Math.random()*8), side:Math.random() < .5 }));
  for (const w of walkers) stepMover(w, .8, dt);
  const wantC = S.weather === 4 ? 0 : Math.min(36, Math.floor(ST.pop/25));
  cars = spawnMover(cars, wantC, n => ({ c:CAR_COLS[n % CAR_COLS.length] }));
  const sp = 2.4*(1 - ST.cong*.75)*(S.weather === 5 ? .7 : 1);
  for (const c of cars) stepMover(c, sp, dt);
}
function drawMovers(){
  for (const w of walkers){
    const horiz = w.dy === 0;
    const px = Math.round(w.fx*T) + (horiz ? 4 + w.ox : (w.side ? 14 : 0)), py = M + Math.round(w.fy*T) + (horiz ? (w.side ? 12 : -2) : 4 + w.oy);
    g.fillStyle = '#f1c9a0'; g.fillRect(px, py, 2, 1);
    g.fillStyle = w.c; g.fillRect(px, py+1, 2, 2);
    g.fillStyle = '#2a2a38'; g.fillRect(px, py+3, 1, 1); g.fillRect(px+1, py+3, 1, Math.floor(now*6)%2);

    for (let i=0; i<160; i++){ const d = drops[i];
      d.y += dt*(storm ? 320 : 220); d.x += dt*S.windDir*(storm ? 160 : 30);
      if (d.y > WH){ d.y = -4; d.x = Math.random()*WW; } if (d.x < 0) d.x += WW; if (d.x > WW) d.x -= WW;

function drawUfo(){
  if (!ufo) return;

/* camera */
let dpr = 1, camTouched = false; const cam = { x:0, y:0, s:2 };
function resize(){
  if (!S) return;
  dpr = window.devicePixelRatio || 1;
  const r = cv.getBoundingClientRect();
  const nw = Math.max(1, Math.round(r.width*dpr)), nh = Math.max(1, Math.round(r.height*dpr));
  if (nw === cv.width && nh === cv.height) return;
  const cx = (cv.width/2 - cam.x)/cam.s, cy = (cv.height/2 - cam.y)/cam.s;
  cv.width = nw; cv.height = nh;
  if (!camTouched) fit(); else { cam.x = nw/2 - cx*cam.s; cam.y = nh/2 - cy*cam.s; clampCam(); }
}
function fit(){
  let x0 = W, x1 = 0, y0 = H, y1 = 0;
  for (let py=0; py<PR; py++) for (let px=0; px<PC; px++) if (S.own[pidx(px,py)]){ x0 = Math.min(x0, px*PS); x1 = Math.max(x1, px*PS+PS); y0 = Math.min(y0, py*PS); y1 = Math.max(y1, py*PS+PS); }
  const ow = (x1-x0)*T, oh = (y1-y0)*T;
  cam.s = Math.max(1, Math.ceil(Math.min(cv.width/ow, cv.height/oh) - .1));
  cam.x = cv.width/2 - ((x0+x1)/2*T)*cam.s; cam.y = cv.height/2 - (M + (y0+y1)/2*T)*cam.s; clampCam();
}
function panTo(x,y){ camTouched = true; cam.x = cv.width/2 - (x*T+8)*cam.s; cam.y = cv.height/2 - (M + y*T)*cam.s; clampCam(); }
function clampCam(){
  const ww = WW*cam.s, wh = WH*cam.s;
  cam.x = ww <= cv.width ? (cv.width-ww)/2 : Math.min(0, Math.max(cv.width-ww, cam.x));
  cam.y = wh <= cv.height ? (cv.height-wh)/2 : Math.min(0, Math.max(cv.height-wh, cam.y));
}
function zoom(dir, ax = cv.width/2, ay = cv.height/2){
  const ns = Math.min(10, Math.max(1, cam.s + dir)); if (ns === cam.s) return; camTouched = true;
  cam.x = ax - (ax - cam.x)*(ns/cam.s); cam.y = ay - (ay - cam.y)*(ns/cam.s); cam.s = ns; clampCam();
}
new ResizeObserver(resize).observe(cv);
function drawMap(){
  mctx.setTransform(1,0,0,1,0,0);
  mctx.fillStyle = '#151726'; mctx.fillRect(0,0,cv.width,cv.height);
  mctx.imageSmoothingEnabled = false;
  const j = mapShake > 0 ? cam.s*2 : 0;
  const sx = j ? Math.round((Math.random()-.5)*j*2) : 0, sy = j ? Math.round((Math.random()-.5)*j) : 0;
  mctx.drawImage(world, Math.round(cam.x) + sx, Math.round(cam.y) + sy, WW*cam.s, WH*cam.s);
}

}
document.querySelectorAll('.tool').forEach(b => b.addEventListener('click', () => setTool(b.dataset.tool)));
function updToolLocks(){

    b.classList.toggle('locked', lock); b.querySelector('small').textContent = lock ? `人口 ${UNLOCK[k]} 解鎖` : `${COST[k]} 金`; }
  for (const k of ['big','land']){ const b = document.querySelector(`.tool[data-tool="${k}"]`), lock = (S.level || 0) < 1;
    b.classList.toggle('locked', lock); b.querySelector('small').textContent = lock ? '小鎮解鎖' : k === 'big' ? '2×2' : `${landPrice()} 金`; }
}
const parcelAdj = (px,py) => N4.some(([a,b]) => { const X = px+a, Y = py+b; return X >= 0 && Y >= 0 && X < PC && Y < PR && S.own[pidx(X,Y)]; });
const landPrice = () => 200 + 100*(S.bought || 0);
function canBig(x,y){ for (let dy=0; dy<2; dy++) for (let dx=0; dx<2; dx++){ const X = x+dx, Y = y+dy; if (!owned(X,Y) || get(X,Y) || terr(X,Y) === 1) return false; } return true; }
function buildable(x,y){ return owned(x,y) && terr(x,y) !== 1; }
function toolValid(x,y){
  const t = get(x,y);
  if (tool === 'road') return owned(x,y) && !t && S.coins >= (terr(x,y) === 1 ? BRIDGE : COST.road);
  if (COST[tool]) return buildable(x,y) && !t && S.coins >= COST[tool] && !(UNLOCK[tool] && ST.pop < UNLOCK[tool]);
  if (tool === 'build') return buildable(x,y) && (!t || t.k === 'bld');
  if (tool === 'landmark') return buildable(x,y) && (!t || t.k === 'lm');
  if (tool === 'big') return canBig(x,y) || (t?.k === 'road' && terr(x,y) === 1 && !t.grand);
  if (tool === 'jp' || tool === 'fun' || tool === 'def') return buildable(x,y) && !t;
  if (tool === 'land') return !owned(x,y) && parcelAdj((x/PS)|0, (y/PS)|0);
  if (tool === 'bulldoze') return !!t && owned(x,y);
  return true;
}
function tileAt(e){
  const r = cv.getBoundingClientRect();
  const px = (e.clientX - r.left)*dpr, py = (e.clientY - r.top)*dpr;
  const wx = (px - cam.x)/cam.s, wy = (py - cam.y)/cam.s;
  return { x:Math.floor(wx/T), y:Math.floor((wy - M)/T) };
}
const pointers = new Map();
let drag = null, lastPaint = -1, pinch = null;
cv.addEventListener('pointerdown', e => {
  cv.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pointers.size === 2){
    const [a,b] = [...pointers.values()];
    pinch = { d:Math.hypot(a.x-b.x, a.y-b.y), s:cam.s }; drag = null; return;
  }
  drag = { x:e.clientX, y:e.clientY, cx:cam.x, cy:cam.y, moved:false, paint: tool === 'road' };
  lastPaint = -1; if (drag.paint) paintRoad(tileAt(e));
});
cv.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  if (pinch && pointers.size === 2){
    const [a,b] = [...pointers.values()], d = Math.hypot(a.x-b.x, a.y-b.y);
    const target = Math.round(pinch.s * d/pinch.d);
    if (target !== cam.s){ const r = cv.getBoundingClientRect(); zoom(target > cam.s ? 1 : -1, ((a.x+b.x)/2 - r.left)*dpr, ((a.y+b.y)/2 - r.top)*dpr); }
    return;
  }
  const tl = tileAt(e); hover = e.pointerType === 'mouse' ? tl : null;
  if (!drag) return;
  if (drag.paint){ paintRoad(tl); return; }
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (Math.hypot(dx,dy) > 6) drag.moved = true;
  if (drag.moved){ camTouched = true; cam.x = drag.cx + dx*dpr; cam.y = drag.cy + dy*dpr; clampCam(); }
});
const endPointer = e => {

function paintRoad(t){

  if (!owned(t.x,t.y)){ toast('這塊地還不是你的，先用「買地」買下來'); return; }
  const bridge = S.terr[i] === 1, cost = bridge ? BRIDGE : COST.road;
  if (S.coins < cost){ toast('金幣不足'); return; }
  S.coins -= cost; S.grid[i] = { k:'road' }; beep(bridge ? 260 : 330,.04);

}
function place(x,y,k){
  if (UNLOCK[k] && ST.pop < UNLOCK[k]) return toast(`${NAMES[k]}在人口達到 ${UNLOCK[k]} 時解鎖`);
  if (!owned(x,y)) return toast('這塊地還不是你的，先用「買地」買下來');
  if (terr(x,y) === 1) return toast('水上只能蓋道路（橋）');
  if (get(x,y)) return toast('這格已經有東西了，先用「拆除」清空');

  S.coins -= COST[k]; S.grid[idx(x,y)] = { k }; beep(520,.08,'triangle'); changed();

}
function tapTile(x,y){
  if (!inb(x,y)){ hidePanel(); return; }

  if (tool === 'look'){ sel = {x,y}; showInfo(x,y); return; }
  if (tool === 'land'){
    if ((S.level || 0) < 1) return toast('買地在城市升級為「小鎮」（人口 100）時解鎖');

    sel = { x, y, parcel:[px,py] };
    return panel(`<h3>買下這塊土地？</h3><p>4×4 格的土地，價格 ${landPrice()} 金。</p><p class="dimtxt">每買一塊，下一塊會貴 100 金。樹林可以免費拆除。</p><div class="btnrow"><button type="button" data-act="buyland" ${S.coins < landPrice() ? 'disabled' : ''}>買下（${landPrice()} 金）</button></div>`);
  }

  }

    sel = {x,y}; showBigPicker(x,y);
  } else if (tool === 'jp'){
    if (terr(x,y) === 1) return toast('水上只能蓋道路（橋）');
    if (t) return t.k === 'big' || ['torii','jgarden','onsen','pagoda'].includes(t.k) ? (sel = {x,y}, showInfo(x,y)) : toast('這格已經有東西了，先用「拆除」清空');
    sel = {x,y}; showJpPicker(x,y);

    if (terr(x,y) === 1) return toast('水上只能蓋道路（橋）');

  g.fillStyle = d; g.fillRect(x-8, y-17, 3, 2);
  g.fillRect(x - 5 + (step ? 1 : 0), y-4, 4, 4); g.fillRect(x + 2 - (step ? 1 : 0), y-4, 4, 4);
}
function drawBattle(){
  if (!BT) return;
  const step = Math.floor(now*6) % 2;
  for (const u of BT.units){
    const x = wx(u.x), y = wyy(u.y), fly = UNITS[u.kind].fly;
    if (u.kind === 'soldier'){ g.fillStyle = u.ally ? '#4a7ab0' : '#4a6b3a'; g.fillRect(x-1, y-3, 2, 3); g.fillStyle = '#2f3a2a'; g.fillRect(x-1, y-4, 2, 1); g.fillStyle = '#1a1a1a'; g.fillRect(x - 1 + step, y, 1, 1); }
    else if (u.kind === 'tank'){ g.fillStyle = u.ally ? '#4a6a8a' : '#5a6b3a'; g.fillRect(x-3, y-2, 7, 4); g.fillStyle = '#2f3a2a'; g.fillRect(x-3, y+1, 7, 1); g.fillStyle = u.ally ? '#6a8aaa' : '#7a8b5a'; g.fillRect(x-1, y-3, 3, 2); lineW(x, y-2, x + Math.cos(u.aim)*5, y - 2 + Math.sin(u.aim)*5, '#2f3a2a'); }
    else { const yy = y - 14; g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(x-2, y, 5, 1); g.fillStyle = u.ally ? '#bcd6ff' : '#c9ccd2'; g.fillRect(x-2, yy-1, 5, 2); g.fillRect(x, yy-3, 1, 6); g.fillStyle = '#ff8a3a'; g.fillRect(x - 3, yy, 1, 1); }
    if (u.hp < u.max){ const by = y - 7 - (fly ? 12 : 0); g.fillStyle = '#300'; g.fillRect(x-3, by, 6, 1); g.fillStyle = '#7cf07a'; g.fillRect(x-3, by, Math.max(1, Math.round(6*u.hp/u.max)), 1); }
  }
  for (const e of BT.enemies){
    const x = wx(e.x), y = wyy(e.y), bob = Math.round(Math.sin(now*6 + e.wob));
    if (e.type === 'robot'){
      g.fillStyle = '#9aa0ad'; g.fillRect(x-2, y-6, 4, 4); g.fillStyle = '#c9ccd2'; g.fillRect(x-2, y-9, 4, 3);
      g.fillStyle = '#ff3a3a'; g.fillRect(x-1, y-8, 2, 1); g.fillStyle = '#5c6380'; g.fillRect(x - 2 + step, y-2, 1, 2); g.fillRect(x + 1 - step, y-2, 1, 2);
      g.fillStyle = '#7cf0ff'; g.fillRect(x, y-11, 1, 2);
    } else if (e.type === 'ufo'){
      const yy = y - 16 + bob;
      if (e.tgt !== null && Math.hypot(e.tgt%W + .5 - e.x, ((e.tgt/W)|0) + .5 - e.y) < .6) for (let k=0; k<14; k++){ g.fillStyle = 'rgba(124,240,122,.22)'; g.fillRect(x - 1 - Math.floor(k/4), yy + 2 + k, 3 + Math.floor(k/2), 1); }
      g.fillStyle = 'rgba(0,0,0,.25)'; g.fillRect(x-4, y, 9, 1);
      g.fillStyle = '#9aa0b5'; g.fillRect(x-5, yy, 11, 2); g.fillStyle = '#6d7385'; g.fillRect(x-6, yy+1, 13, 1);
      g.fillStyle = '#7cf07a'; g.fillRect(x-2, yy-2, 5, 2);
      g.fillStyle = step ? '#fff36a' : '#ff5ab4'; g.fillRect(x-4, yy+1, 1, 1); g.fillRect(x+4, yy+1, 1, 1);
    } else drawKaiju(x, y, step);
    const big = e.type === 'kaiju', bw = big ? 24 : 8, by = y - (big ? 36 : e.type === 'ufo' ? 21 : 14);
    g.fillStyle = '#300'; g.fillRect(x - (bw>>1), by, bw, big ? 2 : 1);
    g.fillStyle = '#ff4a3a'; g.fillRect(x - (bw>>1), by, Math.max(1, Math.round(bw*e.hp/e.max)), big ? 2 : 1);
  }
  for (const q of BT.shots) lineW(wx(q.x0), wyy(q.y0), wx(q.x1), wyy(q.y1), q.col);
  for (const q of BT.booms){ g.globalAlpha = Math.min(1, q.life*2); g.fillStyle = q.col; g.fillRect(wx(q.x), wyy(q.y), 2, 2); }
  g.globalAlpha = 1;
}
function drawDef(x,y,t){
  const px = x*T, py = M + y*T;
  if (t.k === 'turret'){
    g.fillStyle = '#7c818c'; g.fillRect(px+3, py+6, 10, 9); g.fillStyle = '#5f6470'; g.fillRect(px+12, py+6, 1, 9);
    g.fillStyle = '#9aa0ad'; g.fillRect(px+4, py+2, 8, 5);
    const a = t.aim ?? -Math.PI/4; lineW(px+8, py+4, px + 8 + Math.cos(a)*6, py + 4 + Math.sin(a)*6, '#2f343e');
    g.fillStyle = '#d2402c'; g.fillRect(px+7, py+3, 2, 1);
  } else if (t.k === 'aa'){
    g.fillStyle = '#6d7a5a'; g.fillRect(px+2, py+9, 12, 6); g.fillStyle = '#4a5a3a'; g.fillRect(px+5, py+5, 6, 5);
    g.fillStyle = '#2f343e'; g.fillRect(px+6, py-3, 1, 8); g.fillRect(px+9, py-3, 1, 8);
    g.fillStyle = '#7fe8ff'; g.fillRect(px+6, py-4, 1, 1); g.fillRect(px+9, py-4, 1, 1);
  } else if (t.k === 'radar'){
    g.fillStyle = '#7c818c'; g.fillRect(px+4, py+13, 8, 2);
    g.fillStyle = '#8a90a0'; g.fillRect(px+7, py+3, 2, 11);
    const dx = Math.round(Math.cos(now*2)*6); g.fillStyle = '#c9ccd2'; g.fillRect(px + 8 - Math.abs(dx), py, Math.max(1, Math.abs(dx)*2), 3);
    g.fillStyle = Math.floor(now*3) % 2 ? '#ff5a4a' : '#7a2a24'; g.fillRect(px+7, py-1, 2, 1);
  } else if (t.k === 'barracks'){
    g.fillStyle = '#6b7a4a'; g.fillRect(px+1, py+6, 14, 9);
    g.fillStyle = '#55633a'; for (let k=0; k<4; k++) g.fillRect(px + 1 + k, py + 6 - k, 14 - k*2, 1);
    g.fillStyle = '#3a4228'; g.fillRect(px+6, py+10, 4, 5);
    g.fillStyle = '#d0d0d0'; g.fillRect(px+14, py-4, 1, 10); g.fillStyle = '#4a7ab0'; g.fillRect(px+15, py-4, 3, 2);
  }
}
function drawDefBig(ax,ay,k){
  const px = ax*T, top = M + ay*T, bot = M + (ay+2)*T - 1;
  if (k === 'tankyard'){
    g.fillStyle = '#8c8678'; g.fillRect(px, top, 32, 32);
    g.fillStyle = '#6b7a4a'; g.fillRect(px+2, bot-20, 28, 18);
    g.fillStyle = '#55633a'; for (let q=0; q<5; q++) g.fillRect(px + 2 + q*2, bot - 20 - q, 28 - q*4, 1);
    g.fillStyle = '#3a4228'; g.fillRect(px+8, bot-12, 16, 10);
    g.fillStyle = '#5a6b3a'; g.fillRect(px+10, bot-6, 7, 4); g.fillRect(px+12, bot-8, 3, 2);
    g.fillStyle = '#f4b941'; g.fillRect(px+2, bot-1, 28, 1);
  } else {
    g.fillStyle = '#6d7076'; g.fillRect(px, top+14, 32, 12);
    g.fillStyle = '#f4f1ea'; for (let q=0; q<6; q++) g.fillRect(px + 2 + q*5, top+19, 3, 1);
    g.fillStyle = '#8a90a0'; g.fillRect(px+3, top+2, 14, 10); g.fillStyle = '#6d7385'; g.fillRect(px+3, top+1, 14, 2);
    g.fillStyle = '#3a3f4a'; g.fillRect(px+6, top+6, 8, 6);
    g.fillStyle = '#c9ccd2'; g.fillRect(px+22, top+5, 5, 2); g.fillRect(px+24, top+3, 1, 6);
    if (Math.floor(now*2) % 2){ g.fillStyle = '#ff5a4a'; g.fillRect(px+30, top+14, 1, 1); }
  }
}
function showDefPicker(x,y){
  let h = '<h3>防衛設施</h3><p class="dimtxt">外來物種會打掉建築的樓層（但不會整棟摧毀）。</p>';
  DEFS.forEach(D => {
    const lock = ST.pop < D.pop, fit = !D.big || canBig(x,y);
    h += `<button class="pick" type="button" data-act="defb" data-k="${D.k}" ${lock || !fit || S.coins < D.cost ? 'disabled' : ''}><span>${D.n}</span><small>${lock ? `人口達 ${D.pop} 解鎖` : !fit ? '需要 2×2 空地（這格往右、往下各一格）' : `${D.cost} 金 · ${D.d}`}</small></button>`;
  });
  panel(h);
}

/* ---------- HUD ---------- */
function evtLabel(){
  const e = S.evt; if (!e) return '';
  if (e.k === 'typhoon') return '颱風警報';
  if (e.k === 'market') return '市集日';
  if (e.k === 'tour' && e.done) return '觀光團';
  if (e.k === 'blackout' && e.done && !e.end) return '停電中';
  if (e.k === 'fireworks' && e.done) return '煙火節';
  return '';
}
function hud(){
  $('#cityBtn').textContent = S.name + ' ▾';
  $('#tpop').textContent = G.cities.length > 1 ? `（總 ${totalPop()}）` : '';
  $('#coins').textContent = Math.floor(S.coins);
  $('#inc').textContent = `+${ST.inc.toFixed(1)}/時`;
  $('#pop').textContent = ST.pop;
  $('#hap').textContent = ST.pop ? ST.happy + '%' : '—';
  const tl = trafficLabel(), te = $('#trf'); te.textContent = tl; te.style.color = ST.cong < .05 ? '' : ST.cong < .5 ? 'var(--gold)' : 'var(--bad)';
  $('#lvl').textContent = LEVELS[S.level || 0].n;
  const m = Math.floor(S.min % 1440);
  $('#clock').textContent = `${SEASONS[season()].n} · 第 ${dayNo()} 天 ${pad((m/60)|0)}:${pad(m%60)}`;
  $('#wx').textContent = WEATHER[S.weather].n + (S.wind ? (S.windDir > 0 ? ' →' : ' ←') : '');
  const ev = evtLabel(), pol = policy();
  $('#evt').textContent = [ev, pol ? POLICIES[pol].n : ''].filter(Boolean).map(s => '· ' + s).join(' ');
  updToolLocks(); reqTick(); checkGoals();
}

/* ---------- keyboard ---------- */
addEventListener('keydown', e => {
  if (e.target.matches && e.target.matches('input, textarea')){ if (e.key === 'Escape') e.target.blur(); return; }
  if (SM){
    if (!SM.over && (e.code === 'Space' || e.code === 'Enter')){ e.preventDefault(); drop(); }
    else if (e.key === 'Escape'){ SM.over ? closeStack() : endStack('finish'); }
    return;
  }
  if (e.target.closest && e.target.closest('button') && (e.code === 'Space' || e.code === 'Enter')) return;
  const step = 48*dpr, k = e.key;
  if (k === 'ArrowLeft' || k === 'a'){ camTouched = true; cam.x += step; clampCam(); }
  else if (k === 'ArrowRight' || k === 'd'){ camTouched = true; cam.x -= step; clampCam(); }
  else if (k === 'ArrowUp' || k === 'w'){ camTouched = true; cam.y += step; clampCam(); }
  else if (k === 'ArrowDown' || k === 's'){ camTouched = true; cam.y -= step; clampCam(); }
  else if (k === '+' || k === '='){ zoom(1); }
  else if (k === '-'){ zoom(-1); }
  else if (k === 'Escape'){ hidePanel(); }
  else if (k === 'x' || k === 'X'){ toggleXray(); }
  else if (k.length === 1 && k >= '1' && k <= '9'){ setTool(TOOL_ORDER[+k-1]); }
  else if (k === '0'){ setTool(TOOL_ORDER[9]); }
});

/* ---------- loop & boot ---------- */
function resetWorld(){ BT = null; walkers = []; cars = []; fw = []; ufo = null; camTouched = false; groundKey = ''; roadsCache = null; lastQuestHtml = ''; changed(); fit(); }
let last = performance.now(), hudAcc = 0;
function frame(ts){
  const dt = Math.min(.05, (ts - last)/1000); last = ts; now = ts/1000;
  tick(BT ? dt*.25 : dt); updMovers(dt); updStack(dt); updUfo(dt); updFireworks(dt); updBattle(dt);
  mapShake = Math.max(0, mapShake - dt);
  renderWorld(dt); drawMap(); renderStack();
  hudAcc += dt; if (hudAcc > .2){ hudAcc = 0; hud(); }
  requestAnimationFrame(frame);
}
function start(data){
  G = loadGlobal(data && data.G) || loadGlobal(loadLocal()) || newGlobal();
  enterCity(G.cur);
  const fresh = !G.savedAt;
  $('#musicBtn').textContent = `音樂 ${prefs.music ? '開' : '關'}`;
  compute(); resize(); hud();
  if (G.savedAt){ const d = new Date(G.savedAt); $('#saved').textContent = `已存檔（本機）${pad(d.getHours())}:${pad(d.getMinutes())}`; }
  if (fresh) showHelp();
  requestAnimationFrame(t => { last = t; frame(t); });
  connectCloud();
}
try { window.claude?.hot?.snapshot?.(() => ({ G })); } catch {}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();
</script>
